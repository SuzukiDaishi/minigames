name: Restore original Kakipi Tamaire source

on:
  push:
    branches:
      - fix/kakipi-original-v7
    paths:
      - .github/workflows/restore-kakipi-original.yml

permissions:
  contents: write

jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the fix branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Restore the exact original v7 HTML
        shell: bash
        run: |
          set -euo pipefail
          cat kakipi-tamaire/payload/part-*.b64 \
            | tr -d '\r\n' \
            | base64 --decode \
            | gzip --decompress \
            > kakipi-tamaire/index.html.restored

          echo '9928ddf447d9710946a9d45721ad96c762dca7c0465a83998a3870592212f59a  kakipi-tamaire/index.html.restored' \
            | sha256sum --check --strict

          mv kakipi-tamaire/index.html.restored kakipi-tamaire/index.html
          sed -i 's/`${CACHE_PREFIX}v4`/`${CACHE_PREFIX}v5`/' sw.js
          sed -i 's/`${CACHE_PREFIX}v7`/`${CACHE_PREFIX}v8`/' kakipi-tamaire/sw.js

          git rm -r -- kakipi-tamaire/payload
          git rm -- .github/workflows/restore-kakipi-original.yml
          git add -- kakipi-tamaire/index.html sw.js kakipi-tamaire/sw.js

      - name: Commit the restored source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Restore exact original Kakipi Tamaire v7 source'
          git push origin HEAD:${{ github.ref_name }}
