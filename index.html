:root{--ink:#43361f;--cream:#fff8e8}*{box-sizing:border-box}html,body{margin:0;padding:0}body{font-family:'Zen Maru Gothic',sans-serif;color:var(--ink);min-height:100vh;background:radial-gradient(circle at 82% 12%,#fff2a8 0 60px,transparent 62px),radial-gradient(circle at 82% 12%,rgba(255,242,168,.55) 0 110px,transparent 112px),linear-gradient(180deg,#bfe9ff 0%,#d7f4ec 45%,#e9fbe0 100%);background-attachment:fixed;display:flex;flex-direction:column;align-items:center;padding:32px 16px 48px}h1{font-family:'Mochiy Pop One',sans-serif;font-size:clamp(30px,6vw,48px);margin:0 0 6px;color:#5aa01f;text-shadow:3px 3px 0 #fff,5px 5px 0 rgba(90,160,31,.25);letter-spacing:1px}.sub{font-size:14px;font-weight:700;color:#6c5a3a;margin-bottom:28px}.grid{width:100%;max-width:820px;display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:18px}a.gamecard{display:block;text-decoration:none;color:var(--ink);background:var(--cream);border:4px solid #fff;border-radius:24px;padding:20px 18px;box-shadow:0 10px 0 rgba(120,90,40,.18),0 14px 26px rgba(80,60,20,.18);transition:transform .12s,box-shadow .12s}a.gamecard:hover{transform:translateY(-4px)}a.gamecard:active{transform:translateY(2px)}.gameicon{display:block;width:56px;height:56px;object-fit:contain;margin:0 auto 6px;border-radius:16px;background:rgba(255,255,255,.45)}.name{font-family:'Mochiy Pop One';font-size:19px;color:#5aa01f;margin:10px 0 6px}.desc{font-size:13px;line-height:1.7;color:#6c5a3a}footer{margin-top:36px;font-size:12px;color:#9b8a66}</style>
</head><body><h1>🎮 ミニゲーム集</h1><div class="sub">あそびたいゲームをえらんでね！</div><div class="grid">
<a class="gamecard" href="./inchworm-race/"><img class="gameicon" src="./inchworm-race/icons/icon-192.png" alt="ゆびシャクトリ レース" /><div class="name">ゆびシャクトリ レース</div><div class="desc">カメラに手をうつして、人差し指を「曲げて→伸ばす」とシャクトリムシが進むよ！CPU対戦・ふたり対戦もできる！</div></a>
<a class="gamecard" href="./kakipi-tamaire/"><img class="gameicon" src="./kakipi-tamaire/icon-192.png" alt="ふたりで協力！柿ピー玉入れ" /><div class="name">ふたりで協力！柿ピー玉入れ</div><div class="desc">顔の上に出るバーを、あたまの傾きで操作！落ちてくる柿ピーを跳ね返して、ふたりでカゴをねらおう。1人でも遊べるよ！</div></a>
<a class="gamecard" href="./kero-jump/"><img class="gameicon" src="./kero-jump/icon-192.png" alt="ケロジャンプ！" /><div class="name">ケロジャンプ！</div><div class="desc">顔を縦にピョコッと動かしてジャンプ！トゲを避けて進む横スクロールアクション。ひとり・ふたり対戦対応。</div></a>
</div><footer>ホーム画面に追加すると アプリみたいに あそべるよ 📱<br>© minigames</footer><script>if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js'))</script></body></html>
