<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>ケロジャンプ！ ―顔を縦に揺らして跳べ―</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ff5fa2">
<link rel="icon" href="icon-192.png" type="image/png">

<!-- iOS（ホーム画面追加）向け -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ケロジャンプ">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=M+PLUS+Rounded+1c:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --sky1:#7fe0ff; --sky2:#bdf3ff; --sun:#ffe86b;
    --pink:#ff5fa2; --pink-dark:#e0327f;
    --blue:#5fd0ff; --blue-dark:#1f9fd6;
    --ink:#20232b; --yellow:#ffd23f;
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; user-select:none;}
  html,body{height:100%; overflow:hidden; background:var(--ink); font-family:'M PLUS Rounded 1c',sans-serif;}
  #app{position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:var(--ink);}
  #stage{position:relative; width:100%; height:100%; max-width:1100px; max-height:720px; aspect-ratio:16/9;
    background:#000; overflow:hidden; box-shadow:0 0 0 6px #10121a, 0 20px 60px rgba(0,0,0,.6);}
  canvas#game{position:absolute; inset:0; width:100%; height:100%; display:block;}
  video#cam{position:absolute; width:2px; height:2px; opacity:0; pointer-events:none; left:0; top:0;}

  .panel{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; gap:14px; padding:24px; z-index:10;
    background:radial-gradient(120% 100% at 50% 0%, rgba(255,255,255,.06), transparent 60%), rgba(10,14,26,.72);}
  #panelStart{background:#1a1030;}
  #titleArt{position:absolute; inset:0; width:100%; height:100%; display:block; z-index:0;}
  #panelStart > *:not(#titleArt){position:relative; z-index:1;}
  .hidden{display:none !important;}

  .title{font-family:'Mochiy Pop One',sans-serif; color:#fff; font-size:clamp(30px,6.4vw,58px); line-height:1.15;
    text-shadow:0 4px 0 var(--pink-dark), 0 8px 18px rgba(0,0,0,.5); letter-spacing:1px;}
  .title small{display:block; font-family:'M PLUS Rounded 1c',sans-serif; font-weight:700; font-size:0.32em; color:var(--yellow);
    margin-top:6px; text-shadow:0 2px 0 rgba(0,0,0,.4);}

  .camBox{position:relative; width:220px; height:165px; border-radius:18px; overflow:hidden; border:5px solid var(--yellow);
    box-shadow:0 8px 0 rgba(0,0,0,.35); background:#111;}
  .camBox canvas{width:100%; height:100%; display:block; transform:scaleX(-1);}
  .camBox .tag{position:absolute; left:8px; top:6px; background:var(--pink); color:#fff; font-size:11px; font-weight:900;
    padding:2px 8px; border-radius:20px; box-shadow:0 2px 0 rgba(0,0,0,.25);}
  .camBox .msg{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:#fff;
    font-size:13px; font-weight:700; text-align:center; padding:10px; background:rgba(0,0,0,.35);}

  .howto{color:#fff; font-size:13.5px; font-weight:700; max-width:440px; line-height:1.7; text-shadow:0 2px 4px rgba(0,0,0,.4);}
  .howto b{color:var(--yellow);}
  .howto.two b{color:var(--blue);}

  .btnRow{display:flex; gap:14px; flex-wrap:wrap; justify-content:center;}
  .bigBtn{font-family:'Mochiy Pop One',sans-serif; font-size:18px; color:#fff; background:linear-gradient(180deg,var(--pink) 0%, var(--pink-dark) 100%);
    border:none; padding:14px 30px; border-radius:50px; cursor:pointer; box-shadow:0 6px 0 #a3195f, 0 10px 20px rgba(0,0,0,.35);
    transition:transform .08s ease; letter-spacing:1px;}
  .bigBtn:active{transform:translateY(5px); box-shadow:0 1px 0 #a3195f;}
  .bigBtn.alt{background:linear-gradient(180deg,var(--blue) 0%, var(--blue-dark) 100%); box-shadow:0 6px 0 #14719c, 0 10px 20px rgba(0,0,0,.35);}
  .bigBtn.alt:active{box-shadow:0 1px 0 #14719c;}
  .bigBtn.wide{padding:16px 42px; font-size:22px;}

  .errBox{color:#ffd7d7; background:rgba(180,20,20,.35); border:2px dashed #ff8b8b; border-radius:14px; padding:10px 16px;
    font-size:13px; font-weight:700; max-width:420px;}

  .countNum{font-family:'Mochiy Pop One',sans-serif; font-size:130px; color:#fff; text-shadow:0 6px 0 var(--pink-dark), 0 14px 26px rgba(0,0,0,.5);}

  #hud{position:absolute; inset:0; pointer-events:none; z-index:5;}
  #beat{position:absolute; top:8px; left:50%; transform:translateX(-50%); width:14px; height:14px; border-radius:50%;
    background:var(--yellow); box-shadow:0 0 0 3px rgba(255,255,255,.5); opacity:.5; z-index:6;}
  #camMini{position:absolute; top:10px; right:10px; width:110px; height:82px; border-radius:12px; overflow:hidden;
    border:3px solid rgba(255,255,255,.85); box-shadow:0 4px 10px rgba(0,0,0,.35); opacity:.92;}
  #camMini canvas{width:100%; height:100%; transform:scaleX(-1); display:block;}
  #fallbackHint{position:absolute; bottom:8px; left:50%; transform:translateX(-50%); color:#fff; font-size:11.5px;
    font-weight:700; background:rgba(0,0,0,.35); padding:4px 12px; border-radius:20px; opacity:0; transition:opacity .3s; text-align:center;}
  #fallbackHint.show{opacity:1;}

  .resultRow{display:flex; gap:24px; align-items:center; justify-content:center; margin-top:4px;}
  .resultCard{border-radius:16px; padding:10px 18px; font-weight:900; min-width:120px;}
  .resultCard.p1{background:rgba(255,95,162,.22); border:2px solid var(--pink);}
  .resultCard.p2{background:rgba(95,208,255,.22); border:2px solid var(--blue);}
  .resultCard .who{font-size:13px; opacity:.85;}
  .resultCard .num{font-family:'Mochiy Pop One',sans-serif; font-size:26px; color:#fff;}
  .winnerLine{font-family:'Mochiy Pop One',sans-serif; color:var(--yellow); font-size:22px; text-shadow:0 3px 0 rgba(0,0,0,.4);}

  @media (max-width:640px){
    #camMini{width:84px; height:63px;}
    .camBox{width:170px; height:127px;}
    .howto{font-size:12px;}
    .bigBtn{font-size:15px; padding:12px 22px;}
  }
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <video id="cam" autoplay playsinline webkit-playsinline="true" muted></video>
    <canvas id="game"></canvas>

    <div id="hud">
      <div id="beat"></div>
      <div id="camMini" class="hidden"><canvas id="camMiniCv"></canvas></div>
      <div id="fallbackHint">📷が使えない場合：タップ / スペースキー（P1）・Enterキー（P2）でジャンプ！</div>
    </div>

    <!-- START -->
    <div id="panelStart" class="panel">
      <canvas id="titleArt"></canvas>
      <div class="title">ケロジャンプ！<small>～ 顔を縦に揺らして跳べ ～</small></div>
      <div class="camBox">
        <canvas id="startCamCv"></canvas>
        <div class="tag">🐸 CAM</div>
        <div id="startCamMsg" class="msg">遊び方を選んでね</div>
      </div>
      <div class="howto" id="howtoText">顔を <b>ピョコッ</b> と上に動かすとカエルがジャンプ！ 動きが速いほど高く跳ぶ。ビートに乗ってトゲを避けよう！ たまに出る<b>トランポリン</b>に乗ると自動で大ジャンプ、その先の大きなトゲの壁を飛び越えられるよ！</div>
      <div class="btnRow">
        <button id="btnStart1P" class="bigBtn wide">🐸 ひとりであそぶ</button>
        <button id="btnStart2P" class="bigBtn alt wide">🐸🐸 ふたりで対戦</button>
      </div>
      <div id="errBox" class="errBox hidden"></div>
    </div>

    <!-- COUNTDOWN -->
    <div id="panelCount" class="panel hidden">
      <div class="countNum" id="countNum">3</div>
    </div>

    <!-- GAME OVER -->
    <div id="panelOver" class="panel hidden">
      <div class="title" style="font-size:clamp(28px,5.6vw,44px)">ドテッ！！</div>

      <div id="overSingle" class="howto" style="font-size:16px">
        スコア <b><span id="finalScore">0</span></b><br>ベスト <b><span id="bestScore">0</span></b>
      </div>

      <div id="overDuel" class="hidden">
        <div class="winnerLine" id="winnerLine">P1のかち！</div>
        <div class="resultRow">
          <div class="resultCard p1"><div class="who">P1</div><div class="num" id="scoreP1">0</div></div>
          <div class="resultCard p2"><div class="who">P2</div><div class="num" id="scoreP2">0</div></div>
        </div>
      </div>

      <button id="btnRetry" class="bigBtn">もう一回！</button>
      <button id="btnMenu" class="bigBtn alt">モード選択へ</button>
    </div>
  </div>
</div>

<script type="module">
import { mountHomeButton, requestCamera, showCameraHelp, cameraHelpLink } from "../shared/minigames.js";

// MediaPipe は必要になってから読み込む（CDNに届かなくてもページは動き、タップ操作で遊べる）
const VISION_CDN = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

/* ============================================================
   ケロジャンプ！ — 顔トラッキング横スクロールアクション（1P/2P対応）
   ============================================================ */

// ---------- canvas setup ----------
const stage = document.getElementById('stage');
const cvs = document.getElementById('game');
const ctx = cvs.getContext('2d');
let CW = 960, CH = 540;
function resize(){
  const rect = stage.getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio||1, 2);
  cvs.width = Math.round(rect.width*dpr);
  cvs.height = Math.round(rect.height*dpr);
  CW = 960; CH = CW * (rect.height/rect.width);
  ctx.setTransform(dpr*(cvs.width/dpr/CW),0,0,dpr*(cvs.height/dpr/CH),0,0);
}
window.addEventListener('resize', resize);
resize();

// ---------- state ----------
const STATE = { START:'start', COUNT:'count', PLAY:'play', OVER:'over' };
let state = STATE.START;
let mode = 1; // 1 or 2

// ---------- DOM refs ----------
const panelStart = document.getElementById('panelStart');
const panelCount = document.getElementById('panelCount');
const panelOver  = document.getElementById('panelOver');
const btnStart1P = document.getElementById('btnStart1P');
const btnStart2P = document.getElementById('btnStart2P');
const btnRetry   = document.getElementById('btnRetry');
const btnMenu    = document.getElementById('btnMenu');
const countNum   = document.getElementById('countNum');
const errBox     = document.getElementById('errBox');
const startCamMsg= document.getElementById('startCamMsg');
const howtoText  = document.getElementById('howtoText');
const beatDot    = document.getElementById('beat');
const camMini    = document.getElementById('camMini');
const fallbackHint = document.getElementById('fallbackHint');
const video = document.getElementById('cam');
const startCamCv = document.getElementById('startCamCv');
const camMiniCv  = document.getElementById('camMiniCv');
const titleArtCv = document.getElementById('titleArt');
const titleArtCtx = titleArtCv.getContext('2d');
function resizeTitleArt(){
  const rect = panelStart.getBoundingClientRect();
  if(rect.width<=0 || rect.height<=0) return;
  const dpr = Math.min(window.devicePixelRatio||1, 2);
  titleArtCv.width = Math.round(rect.width*dpr);
  titleArtCv.height = Math.round(rect.height*dpr);
  titleArtCtx.setTransform(dpr,0,0,dpr,0,0);
}
window.addEventListener('resize', resizeTitleArt);
const overSingle = document.getElementById('overSingle');
const overDuel   = document.getElementById('overDuel');
const winnerLine = document.getElementById('winnerLine');

// ============================================================
// AUDIO — 全て Web Audio API で内製（サンプル音源不使用）
// ============================================================
let actx = null;
function ensureAudio(){ if(!actx){ actx = new (window.AudioContext||window.webkitAudioContext)(); } if(actx.state==='suspended') actx.resume(); }
function master(){ return actx.destination; }

function playKick(strong){
  if(!actx) return;
  const t = actx.currentTime;
  const o = actx.createOscillator(); const g = actx.createGain();
  o.type='sine';
  o.frequency.setValueAtTime(strong?150:110, t);
  o.frequency.exponentialRampToValueAtTime(38, t+0.11);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(strong?0.5:0.28, t+0.006);
  g.gain.exponentialRampToValueAtTime(0.0001, t+0.22);
  o.connect(g); g.connect(master());
  o.start(t); o.stop(t+0.24);
}
function playHat(){
  if(!actx) return;
  const t = actx.currentTime;
  const buf = actx.createBuffer(1, actx.sampleRate*0.04, actx.sampleRate);
  const d = buf.getChannelData(0);
  for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*(1-i/d.length);
  const s = actx.createBufferSource(); s.buffer = buf;
  const f = actx.createBiquadFilter(); f.type='highpass'; f.frequency.value=6000;
  const g = actx.createGain(); g.gain.setValueAtTime(0.10, t); g.gain.exponentialRampToValueAtTime(0.0001, t+0.05);
  s.connect(f); f.connect(g); g.connect(master()); s.start(t); s.stop(t+0.06);
}
function playJump(power, pan){
  if(!actx) return;
  const t = actx.currentTime;
  const o = actx.createOscillator(); const g = actx.createGain();
  o.type='square';
  const base = 260 + Math.min(power,1)*260;
  o.frequency.setValueAtTime(base, t);
  o.frequency.exponentialRampToValueAtTime(base*2.1, t+0.09);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(0.16, t+0.008);
  g.gain.exponentialRampToValueAtTime(0.0001, t+0.14);
  const f = actx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=3200;
  let node = f;
  if(pan!==undefined && actx.createStereoPanner){ const p = actx.createStereoPanner(); p.pan.value=pan; f.connect(p); node=p; }
  o.connect(f); node.connect(g); g.connect(master());
  o.start(t); o.stop(t+0.16);
}
function playLand(){
  if(!actx) return;
  const t = actx.currentTime;
  const o = actx.createOscillator(); const g = actx.createGain();
  o.type='sine'; o.frequency.setValueAtTime(180,t); o.frequency.exponentialRampToValueAtTime(60,t+0.09);
  g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(0.18,t+0.005); g.gain.exponentialRampToValueAtTime(0.0001,t+0.12);
  o.connect(g); g.connect(master()); o.start(t); o.stop(t+0.13);
}
function playBoing(){
  if(!actx) return;
  const t = actx.currentTime;
  const dur = 0.6;

  // 基音：上ずってからゆっくり落ち着く
  const carrier = actx.createOscillator();
  carrier.type = 'sine';
  carrier.frequency.setValueAtTime(230, t);
  carrier.frequency.linearRampToValueAtTime(460, t+0.07);
  carrier.frequency.exponentialRampToValueAtTime(150, t+dur);

  // LFOでピッチを揺らして「ビヨヨーン」という弾力感を出す
  const lfo = actx.createOscillator();
  lfo.type = 'sine';
  lfo.frequency.setValueAtTime(24, t);
  lfo.frequency.exponentialRampToValueAtTime(9, t+dur);
  const lfoGain = actx.createGain();
  lfoGain.gain.setValueAtTime(70, t);
  lfoGain.gain.exponentialRampToValueAtTime(3, t+dur);
  lfo.connect(lfoGain);
  lfoGain.connect(carrier.frequency);

  const g = actx.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(0.32, t+0.025);
  g.gain.exponentialRampToValueAtTime(0.0001, t+dur);

  carrier.connect(g); g.connect(master());
  carrier.start(t); lfo.start(t);
  carrier.stop(t+dur+0.02); lfo.stop(t+dur+0.02);
}
function playClear(){
  if(!actx) return;
  const t = actx.currentTime;
  [660,880].forEach((freq,i)=>{
    const o = actx.createOscillator(); const g = actx.createGain();
    o.type='triangle'; o.frequency.value=freq;
    g.gain.setValueAtTime(0.0001, t+i*0.05);
    g.gain.linearRampToValueAtTime(0.14, t+i*0.05+0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t+i*0.05+0.16);
    o.connect(g); g.connect(master()); o.start(t+i*0.05); o.stop(t+i*0.05+0.18);
  });
}
function playCrash(){
  if(!actx) return;
  const t = actx.currentTime;
  const buf = actx.createBuffer(1, actx.sampleRate*0.35, actx.sampleRate);
  const d = buf.getChannelData(0);
  for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*(1-i/d.length);
  const s = actx.createBufferSource(); s.buffer = buf;
  const f = actx.createBiquadFilter(); f.type='lowpass'; f.frequency.setValueAtTime(4000,t); f.frequency.exponentialRampToValueAtTime(300,t+0.3);
  const g = actx.createGain(); g.gain.setValueAtTime(0.32, t); g.gain.exponentialRampToValueAtTime(0.0001, t+0.35);
  s.connect(f); f.connect(g); g.connect(master()); s.start(t); s.stop(t+0.36);
  const o = actx.createOscillator(); const g2 = actx.createGain();
  o.type='sawtooth'; o.frequency.setValueAtTime(140,t); o.frequency.exponentialRampToValueAtTime(40,t+0.4);
  g2.gain.setValueAtTime(0.0001,t); g2.gain.linearRampToValueAtTime(0.2,t+0.02); g2.gain.exponentialRampToValueAtTime(0.0001,t+0.42);
  o.connect(g2); g2.connect(master()); o.start(t); o.stop(t+0.43);
}
function playFanfare(){
  if(!actx) return;
  const t = actx.currentTime;
  [523,659,784,1047].forEach((freq,i)=>{
    const o = actx.createOscillator(); const g = actx.createGain();
    o.type='triangle'; o.frequency.value=freq;
    const st = t+i*0.09;
    g.gain.setValueAtTime(0.0001, st);
    g.gain.linearRampToValueAtTime(0.15, st+0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, st+0.3);
    o.connect(g); g.connect(master()); o.start(st); o.stop(st+0.32);
  });
}

// 「カメラのせってい」ボタン（拒否・失敗時に errBox に出す）
function camHelpButton(){
  const b = document.createElement('button');
  b.type = 'button';
  b.textContent = '📷 カメラのせってい';

    + 'color:#fff;background:#5b4bd6;border:none;border-radius:999px;padding:8px 18px;cursor:pointer;';
  b.addEventListener('click', ()=> showCameraHelp());
  return b;
}

function isSecureEnough(){
  return location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1';
}

async function initFace(numFaces){
  startCamMsg.textContent = 'カメラを準備中...';

  if(!isSecureEnough()){
    useFallback = true;
    startCamMsg.textContent = 'https:// または localhost で開いてね';
    errBox.textContent = 'このページを file:// で直接開くと、iPad SafariではカメラAPIが使えません。簡易サーバー等で http://localhost または https:// から開いてください。今はタップ/キーで遊べます。';
    errBox.classList.remove('hidden');
    fallbackHint.classList.add('show');
    return;
  }

  try{
    // iOS Safari は自動再生ポリシーが厳しいため、muted属性を明示的にJS側でも設定
    video.muted = true;
    video.setAttribute('muted','');
    video.setAttribute('autoplay','');
    // 厳密な width/height 指定は iPad Safari で OverconstrainedError になりやすいため ideal を使用
    // 取得は shared/minigames.js が一元管理（1P→2P と選び直しても許可を聞かれるのは最初の1回だけ）
    const stream = await requestCamera({
      video:{ facingMode:'user', width:{ideal:320}, height:{ideal:240} },
      audio:false
    });
    if(video.srcObject !== stream) video.srcObject = stream;
    await video.play();
  }catch(e){
    console.warn('camera error', e);
    useFallback = true;
    if(e && (e.name==='NotAllowedError' || e.denied)){
      startCamMsg.textContent = 'カメラが拒否されています';
      errBox.textContent = 'カメラへのアクセスが許可されていません。今はタップ/キーで遊べます。';
      errBox.appendChild(camHelpButton());
    } else {
      startCamMsg.textContent = 'カメラが使えません';
      errBox.textContent = 'カメラを起動できませんでした。他のアプリでカメラを使用中でないか確認するか、タップ/キーで遊んでください。';
    }
    errBox.classList.remove('hidden');
    fallbackHint.classList.add('show');
    return;
  }

  try{
    startCamMsg.textContent = 'AIモデルを読み込み中...';
    const { FaceLandmarker, FilesetResolver } = await import(VISION_CDN);
    const fileset = await FilesetResolver.forVisionTasks(
      "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
    );
    const opts = (delegate)=>({
      baseOptions:{
        modelAssetPath:"https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",
        delegate
      },
      runningMode:"VIDEO",
      numFaces: numFaces
    });
    if(faceLandmarker){ try{ faceLandmarker.close(); }catch(_e){} faceLandmarker = null; }
    try{
      // iPad SafariはGPU(WebGL)委譲で初期化に失敗することがあるため、まずGPUを試す
      faceLandmarker = await FaceLandmarker.createFromOptions(fileset, opts("GPU"));
    }catch(gpuErr){
      console.warn('GPU delegate failed, falling back to CPU', gpuErr);
      faceLandmarker = await FaceLandmarker.createFromOptions(fileset, opts("CPU"));
    }
    faceReady = true;
    initializedNumFaces = numFaces;
    startCamMsg.textContent = '準備OK！顔を映してね';
  }catch(e){
    console.warn('mediapipe load error', e);
    useFallback = true;
    startCamMsg.textContent = 'AIモデルの読込に失敗';
    errBox.textContent = '顔認識AIの読み込みに失敗しました。通信状況を確認して再読み込みするか、タップ/キーで遊んでください。';
    errBox.classList.remove('hidden');
    fallbackHint.classList.add('show');
  }
}

function detectFace(now){
  facesRaw = [];
  if(!faceReady || !faceLandmarker || video.readyState < 2) return;
  let result;
  try{ result = faceLandmarker.detectForVideo(video, now); }catch(e){ return; }
  if(result && result.faceLandmarks && result.faceLandmarks.length>0){
    facesRaw = result.faceLandmarks.map(lm=>{
      const noseY = lm[1] ? lm[1].y : 0.5;
      const browY = lm[168] ? lm[168].y : noseY;
      const nx = lm[1] ? lm[1].x : 0.5;
      return { x:nx, y:(noseY*0.6+browY*0.4) };
    }).sort((a,b)=>a.x-b.x);
  }
}

function updatePlayerFace(p, dt){
  const f = p.face;
  let sample = null;
  if(mode===1){
    sample = facesRaw[0] || null;
  } else {
    if(facesRaw.length>=2){
      sample = p.idx===0 ? facesRaw[0] : facesRaw[1];
    } else if(facesRaw.length===1){
      // どちらのプレイヤーに近いかで割当（相手が居ない間の暴発を防ぐ）
      const dist = Math.abs(facesRaw[0].x - f.lastRawX);
      const otherP = players[p.idx===0?1:0];
      const otherDist = Math.abs(facesRaw[0].x - otherP.face.lastRawX);
      if(dist <= otherDist) sample = facesRaw[0];
    }
  }
  if(sample){
    f.detected = true; f.lastRawX = sample.x;
    f.smoothY += (sample.y - f.smoothY) * Math.min(1, dt*24);
    f.history.push({y:f.smoothY, t: performance.now()});
    while(f.history.length>6) f.history.shift();
    if(f.history.length>=2){
      const a=f.history[0], b=f.history[f.history.length-1];
      const dtt = Math.max(0.001,(b.t-a.t)/1000);
      f.velocity = (a.y-b.y)/dtt;
    }
  } else {
    f.detected = false;
    f.velocity *= 0.85; // 検出ロスト時は緩やかに減衰
  }
}

// ---------- mini preview drawing ----------
function drawCamPreview(canvas){
  if(!video.videoWidth) return;
  const c = canvas.getContext('2d');
  c.canvas.width = 160; c.canvas.height = 120;
  c.drawImage(video, 0,0,160,120);
  const colors = ['#ff5fa2','#5fd0ff'];
  facesRaw.forEach((fpt,i)=>{
    c.fillStyle = mode===2 ? colors[Math.min(i,1)] : '#ff5fa2';
    c.beginPath(); c.arc(160*fpt.x, 120*fpt.y, 5, 0, Math.PI*2); c.fill();
  });
}

// タイトル画面：レースゲームのパッケージ風ダイナミックアート

function drawTitleArt(t){
  const rect = panelStart.getBoundingClientRect();
  const W = rect.width, H = rect.height;
  if(W<=0 || H<=0) return;
  if(titleArtCv.width !== Math.round(W*Math.min(window.devicePixelRatio||1,2))) resizeTitleArt();
  const g = titleArtCtx;
  g.clearRect(0,0,W,H);

  // 1) ダイナミックな空（中心から発光するグラデーション）
  const cx = W*0.52, glowY = H*0.33;
  const sky = g.createRadialGradient(cx,glowY,10, cx,glowY, Math.max(W,H)*0.85);
  sky.addColorStop(0,'#fff3c4');
  sky.addColorStop(0.22,'#ffb84d');
  sky.addColorStop(0.5,'#ff6fa8');
  sky.addColorStop(1,'#241241');
  g.fillStyle = sky; g.fillRect(0,0,W,H);

  // 2) 回転する放射スピードライン
  g.save();
  g.translate(cx,glowY);
  g.rotate(t*0.06);
  const rays = 20;
  for(let i=0;i<rays;i++){
    g.save();
    g.rotate((i/rays)*Math.PI*2);
    g.fillStyle = i%2===0 ? 'rgba(255,255,255,.11)' : 'rgba(255,255,255,.04)';
    g.beginPath();
    g.moveTo(0,0);
    g.arc(0,0, Math.max(W,H)*1.2, 0, (Math.PI*2/rays)*0.5);
    g.closePath(); g.fill();
    g.restore();
  }
  g.restore();

  // 3) 遠近感のあるコース（奥の消失点に向かって収束）
  const trackTopY = H*0.40, trackBottomY = H*1.06;
  const topHalfW = W*0.05, bottomHalfW = W*0.7;
  const trackGrad = g.createLinearGradient(0,trackTopY,0,trackBottomY);
  trackGrad.addColorStop(0,'#6fc24a'); trackGrad.addColorStop(1,'#4a9a34');
  g.fillStyle = trackGrad;
  g.beginPath();
  g.moveTo(cx-topHalfW, trackTopY);
  g.lineTo(cx+topHalfW, trackTopY);
  g.lineTo(cx+bottomHalfW, trackBottomY);
  g.lineTo(cx-bottomHalfW, trackBottomY);
  g.closePath(); g.fill();

  // 中央の収束レーンライン（流れる点線）
  g.strokeStyle = 'rgba(255,255,255,.55)'; g.lineWidth = 3;
  g.setLineDash([16,16]); g.lineDashOffset = -t*50;
  g.beginPath(); g.moveTo(cx,trackTopY); g.lineTo(cx,trackBottomY); g.stroke();
  g.setLineDash([]);

  // 手前のチェッカー柄スタートライン
  const checkY = trackBottomY - H*0.1, checkH = H*0.05;
  const checkHalfW = bottomHalfW*0.94, cols = 16;
  for(let i=0;i<cols;i++){
    const x0 = cx-checkHalfW + (checkHalfW*2/cols)*i;
    const x1 = x0 + (checkHalfW*2/cols);
    g.fillStyle = (i%2===0) ? '#ffffff' : '#20232b';
    g.fillRect(x0, checkY, x1-x0, checkH);
  }

  // 中景の小さな「ケロジャンプレース」バナー
  const bx = cx, byBase = trackTopY + (checkY-trackTopY)*0.42;
  const poleH = H*0.07, poleGap = W*0.05;
  g.strokeStyle = '#8a5a2c'; g.lineWidth = 3;
  [bx-poleGap, bx+poleGap].forEach(px=>{
    g.beginPath(); g.moveTo(px, byBase+poleH); g.lineTo(px, byBase); g.stroke();
  });
  g.fillStyle = '#ff5fa2';
  g.beginPath();
  g.moveTo(bx-poleGap, byBase); g.lineTo(bx+poleGap, byBase);
  g.lineTo(bx+poleGap, byBase+poleH*0.42); g.lineTo(bx-poleGap, byBase+poleH*0.42);
  g.closePath(); g.fill();
  g.fillStyle='#fff'; g.textAlign='center';
  g.font = `900 ${Math.max(9,poleH*0.3)}px 'Mochiy Pop One', sans-serif`;
  g.fillText('ケロジャンプレース', bx, byBase+poleH*0.3);

  // 4) 手前・主役のケロちゃん（大きく傾けてダイナミックに）
  if(keroImgGreen.complete && keroImgGreen.naturalWidth>0){
    const kw = W*0.38, kh = kw*KERO_IMG_ASPECT;
    const kx = W*0.5, ky = H*0.93;
    g.save();
    g.translate(kx,ky);
    g.rotate(-0.13 + Math.sin(t*0.9)*0.02);

    // モーションライン
    g.strokeStyle = 'rgba(255,255,255,.55)'; g.lineWidth = Math.max(2,kw*0.02); g.lineCap='round';
    for(let i=0;i<5;i++){
      const yy = -kh*0.32 + i*kh*0.15;
      g.beginPath(); g.moveTo(-kw*0.95,yy); g.lineTo(-kw*0.55,yy); g.stroke();
    }
    // 接地影
    g.fillStyle = 'rgba(0,0,0,.28)';
    g.beginPath(); g.ellipse(0, kh*0.05, kw*0.4, kw*0.11, 0,0,Math.PI*2); g.fill();

    g.drawImage(keroImgGreen, -kw/2, -kh*0.62, kw, kh);
    g.restore();
  }

  // 5) 上下に可読性用の暗いグラデーション
  const topScrim = g.createLinearGradient(0,0,0,H*0.3);
  topScrim.addColorStop(0,'rgba(8,6,20,.6)'); topScrim.addColorStop(1,'rgba(8,6,20,0)');
  g.fillStyle = topScrim; g.fillRect(0,0,W,H*0.3);
  const botScrim = g.createLinearGradient(0,H*0.6,0,H);
  botScrim.addColorStop(0,'rgba(8,6,20,0)'); botScrim.addColorStop(1,'rgba(8,6,20,.7)');
  g.fillStyle = botScrim; g.fillRect(0,H*0.6,W,H*0.4);
}

// ============================================================
// GAME WORLD
// ============================================================
const GRAVITY_BASE = 2500;
const JUMP_BASE_V = 1120;   // 792 * √2 ≒ さらに高さ2倍（元の4倍）
const JUMP_VEL_SCALE = 1039; // 735 * √2
const JUMP_MAX_V = 2700;   // 1909 * √2
const JUMP_TRIGGER = 0.32;
const TRAMPOLINE_VEL = 1900; // 3799 * 0.5 ≒ 高さ1/4

const OBSTACLE_TYPES = [
  { id:'spike', w:44, h:40, color:'#e34b4b', dark:'#a12c2c' },
];
const TRAMPOLINE_TYPE = { id:'trampoline', w:92, h:16, color:'#ffcf3f', dark:'#c98f10' };
const BIGSPIKE_TYPE   = { id:'bigspike', w:260, h:56, color:'#e34b4b', dark:'#a12c2c' };
const TRAMPOLINE_TO_BIGSPIKE_GAP = 130; // トランポリンから大トゲまでの距離(px, 1P基準)

let players = [];
let playStartGrace = 0; // プレイ開始直後、顔トラッキング初期化の誤検知でジャンプしないようにする猶予時間
let elapsed = 0, bpm = 100, beatPhase = 0, scrollSpeed = 320, beatPulse = 0;
let bestScore1P = 0;
let distSinceSpawn = 0, lastSpawnWidth = 0, nextGapKeros = 3;
const OBSTACLE_GAP_MIN = 3, OBSTACLE_GAP_MAX = 5; // 障害物同士の隙間 = ケロちゃん3〜5体分のランダム
let comboInProgress = false, comboAcc = 0, nextComboTime = 12;

function mkPlayer(idx, bandTop, bandH, scale, tag, colorHex){
  return {
    idx, bandTop, bandH, scale, tag, colorHex,
    frog:{ x: CW*0.20, y:0, vy:0, grounded:true, squash:1, faceDir:1, legPhase:0 },
    obstacles:[], particles:[], popTexts:[],
    score:0, combo:0, alive:true, downTimer:0, lastBeatSpawned:false,
    face:{ smoothY:0.5, history:[], velocity:0, detected:false, lastRawX: idx===0?0.3:0.7 },
    clouds:[], bgFar:[], startX: CW*0.20,
  };
}

function groundY(p){ return p.bandTop + p.bandH*0.76; }

function resetGame(){
  elapsed = 0; bpm = 100; beatPhase = 0; scrollSpeed = 320; beatPulse = 0;
  distSinceSpawn = 999999; lastSpawnWidth = 0; // 開始直後にすぐ1体目が出せるように
  nextGapKeros = OBSTACLE_GAP_MIN + Math.random()*(OBSTACLE_GAP_MAX-OBSTACLE_GAP_MIN);
  comboInProgress = false; comboAcc = 0;
  nextComboTime = 10 + Math.random()*6;
  players = [];
  if(mode===1){
    players.push(mkPlayer(0, 0, CH, 1, '', '#ff5fa2'));
  } else {
    const gap = 6;
    const bandH = (CH-gap)/2;
    players.push(mkPlayer(0, 0, bandH, 0.56, 'P1', '#ff5fa2'));
    players.push(mkPlayer(1, bandH+gap, bandH, 0.56, 'P2', '#5fd0ff'));
  }
  players.forEach(p=>{
    p.frog.y = groundY(p);
    p.clouds = Array.from({length:4},()=>({x:Math.random()*CW, y:p.bandTop+30+Math.random()*(p.bandH*0.35), r:(20+Math.random()*16)*p.scale, s:0.15+Math.random()*0.15}));
    p.bgFar = Array.from({length:7},(_,i)=>({x:i*170+Math.random()*60, h:(40+Math.random()*60)*p.scale}));
  });
}

function spawnObstacle(forcedType){
  const type = forcedType || OBSTACLE_TYPES[0];
  lastSpawnWidth = type.w;
  players.forEach(p=>{
    // 脱落済み（ゴースト状態）のプレイヤーのレーンにも、遊び続けられるよう障害物を出し続ける
    const w = type.w*p.scale, h = type.h*p.scale;
    p.obstacles.push({
      type, x: CW+40, y: groundY(p) - h,
      w, h, passed:false, used:false, telegraph: 0,
    });
  });
}

function startTrampolineCombo(){
  spawnObstacle(TRAMPOLINE_TYPE);
  distSinceSpawn = 0;
  comboInProgress = true;
  comboAcc = 0;
}

function onBeat(){
  const strong = (Math.floor(elapsed*bpm/60) % 4 === 0);
  playKick(strong); if(!strong) playHat();
  beatPulse = 1;
  if(state===STATE.PLAY && players.some(p=>p.alive)){
    const keroWidthBase = 54*FROG_VISUAL_SCALE; // 1P基準でのケロちゃんの表示幅
    const desiredGap = nextGapKeros * keroWidthBase;
    const gapOk = distSinceSpawn >= lastSpawnWidth + desiredGap;
    if(!comboInProgress && elapsed >= nextComboTime && gapOk){
      startTrampolineCombo();
      nextComboTime = elapsed + 14 + Math.random()*8;
    } else if(!comboInProgress && gapOk){
      spawnObstacle();
      distSinceSpawn = 0;
      nextGapKeros = OBSTACLE_GAP_MIN + Math.random()*(OBSTACLE_GAP_MAX-OBSTACLE_GAP_MIN);
    }
  }
}

function addPop(p, text, x, y, color){
  p.popTexts.push({text,x,y,vy:-60*p.scale,life:0.9,maxLife:0.9,color:color||'#fff', rot:(Math.random()-0.5)*0.3});
}
function addBurst(p, x,y,color,n=10){
  for(let i=0;i<n;i++){
    const a = Math.random()*Math.PI*2, sp = (60+Math.random()*160)*p.scale;
    p.particles.push({x,y,vx:Math.cos(a)*sp, vy:Math.sin(a)*sp-80*p.scale, life:0.5+Math.random()*0.3, r:(3+Math.random()*3)*p.scale, color});
  }
}

function tryJump(p){
  if(state!==STATE.PLAY || !p.frog.grounded || playStartGrace>0) return;
  const powerNorm = Math.min(1, Math.max(0, (p.face.velocity-JUMP_TRIGGER)/1.1));
  const vel = -(JUMP_BASE_V + powerNorm*JUMP_VEL_SCALE*2.1) * p.scale;
  p.frog.vy = Math.max(-JUMP_MAX_V*p.scale, vel);
  p.frog.grounded = false;
  playJump(powerNorm, mode===2 ? (p.idx===0?-0.4:0.4) : undefined);
  addBurst(p, p.frog.x, groundY(p)+6*p.scale, '#ffffff', 6);
}
function manualJump(p){
  if(state!==STATE.PLAY || !p.frog.grounded) return;
  p.frog.vy = -(JUMP_BASE_V + JUMP_VEL_SCALE*1.1) * p.scale * 0.5; // 高さ1/4（速度0.5倍）
  p.frog.grounded = false;
  playJump(0.7, mode===2 ? (p.idx===0?-0.4:0.4) : undefined);
  addBurst(p, p.frog.x, groundY(p)+6*p.scale, '#ffffff', 6);
}

function updatePlayer(p, dt){
  if(!useFallback) updatePlayerFace(p, dt);
  if(!p.alive && p.downTimer>0){
    p.downTimer -= dt;
    // ダウン演出中は操作不能。パーティクル/テキストだけ減衰させる
    for(let i=p.particles.length-1;i>=0;i--){ const pt=p.particles[i]; pt.vy+=700*dt; pt.x+=pt.vx*dt; pt.y+=pt.vy*dt; pt.life-=dt; if(pt.life<=0) p.particles.splice(i,1); }
    for(let i=p.popTexts.length-1;i>=0;i--){ const pt=p.popTexts[i]; pt.y+=pt.vy*dt; pt.vy+=40*dt; pt.life-=dt; if(pt.life<=0) p.popTexts.splice(i,1); }
    return;
  }
  if(!useFallback && p.face.velocity > JUMP_TRIGGER) tryJump(p);

  const wasGrounded = p.frog.grounded;
  p.frog.vy += GRAVITY_BASE*p.scale*dt;
  p.frog.y += p.frog.vy*dt;
  const gy = groundY(p);
  if(p.frog.y >= gy){
    p.frog.y = gy;
    if(!wasGrounded){ playLand(); p.frog.squash = 0.62; addBurst(p, p.frog.x, gy+6*p.scale, '#c9924f', 5); }
    p.frog.vy = 0; p.frog.grounded = true;
  }
  p.frog.squash += (1-p.frog.squash)*Math.min(1,dt*10);
  if(p.frog.grounded) p.frog.legPhase += dt*7;

  p.clouds.forEach(c=>{ c.x -= c.s*scrollSpeed*dt; if(c.x < -60) c.x = CW+60; });
  p.bgFar.forEach(b=>{ b.x -= scrollSpeed*0.35*dt; if(b.x < -80) b.x += CW+160; });
  p.startX -= scrollSpeed*dt;

  const fw = 56*p.scale*FROG_VISUAL_SCALE, fh = 46*p.scale*FROG_VISUAL_SCALE;
  const frogBox = { x: p.frog.x - fw*0.32, y: p.frog.y - fh*0.85, w: fw*0.64, h: fh*0.85 };

  for(let i=p.obstacles.length-1;i>=0;i--){
    const ob = p.obstacles[i];
    ob.x -= scrollSpeed*dt;
    if(ob.telegraph>0) ob.telegraph -= dt;
    if(ob.x + ob.w < -20){ p.obstacles.splice(i,1); continue; }

    if(ob.type.id==='trampoline'){
      if(!ob.used){
        const obBox = { x:ob.x, y:ob.y, w:ob.w, h:ob.h };
        const hit = frogBox.x<obBox.x+obBox.w && frogBox.x+frogBox.w>obBox.x &&
                    frogBox.y<obBox.y+obBox.h && frogBox.y+frogBox.h>obBox.y;
        if(hit && p.frog.grounded){
          if(p.alive) ob.used = true; // 脱落後も跳ねて遊べるが、繰り返し使えるよう「使用済み」にはしない
          p.frog.vy = -(TRAMPOLINE_VEL*p.scale);
          p.frog.grounded = false;
          playBoing();
          if(p.alive){
            addPop(p, '大ジャンプ！！', p.frog.x, p.frog.y-90*p.scale, '#ffd23f');
          }
          addBurst(p, p.frog.x, groundY(p), '#ffd23f', 14);
        }
      }
      continue;
    }

    // 脱落済みプレイヤーはスコア加算も被弾判定もなし（自由に遊べるゴースト状態）
    if(!p.alive) continue;

    if(!ob.passed && ob.x+ob.w < p.frog.x - fw*0.3){
      ob.passed = true; p.combo++; p.score += 10 + p.combo;
      if(p.combo>1) addPop(p, (p.combo>=5?'スーパー！':'ナイス！'), p.frog.x, p.frog.y-70*p.scale, '#ffe86b');
      playClear();
    }
    if(ob.telegraph<=0){
      const obBox = { x:ob.x, y:ob.y, w:ob.w, h:ob.h };
      const hit = frogBox.x<obBox.x+obBox.w && frogBox.x+frogBox.w>obBox.x &&
                  frogBox.y<obBox.y+obBox.h && frogBox.y+frogBox.h>obBox.y;
      if(hit){ knockOut(p); return; }
    }
  }

  for(let i=p.particles.length-1;i>=0;i--){ const pt=p.particles[i]; pt.vy+=700*dt; pt.x+=pt.vx*dt; pt.y+=pt.vy*dt; pt.life-=dt; if(pt.life<=0) p.particles.splice(i,1); }
  for(let i=p.popTexts.length-1;i>=0;i--){ const pt=p.popTexts[i]; pt.y+=pt.vy*dt; pt.vy+=40*dt; pt.life-=dt; if(pt.life<=0) p.popTexts.splice(i,1); }
}

let shake = 0;
function knockOut(p){
  p.alive = false;
  p.downTimer = 0.9;
  playCrash();
  shake = Math.max(shake, mode===1?1:0.6);
  addPop(p, mode===1?'ドテッ！！':'K.O.！', p.frog.x, p.frog.y-90*p.scale, p.colorHex);
  addBurst(p, p.frog.x, p.frog.y-30*p.scale, '#ffcf3f', 16);
  if(players.every(pl=>!pl.alive)) finishGame();
}

function finishGame(){
  state = STATE.OVER;
  if(mode===1){
    bestScore1P = Math.max(bestScore1P, Math.floor(players[0].score));
    setTimeout(()=>{
      overSingle.classList.remove('hidden'); overDuel.classList.add('hidden');
      document.getElementById('finalScore').textContent = Math.floor(players[0].score);
      document.getElementById('bestScore').textContent = bestScore1P;
      panelOver.classList.remove('hidden');
    }, 650);
  } else {
    const s1 = Math.floor(players[0].score), s2 = Math.floor(players[1].score);
    setTimeout(()=>{
      overSingle.classList.add('hidden'); overDuel.classList.remove('hidden');
      document.getElementById('scoreP1').textContent = s1;
      document.getElementById('scoreP2').textContent = s2;
      if(s1===s2) winnerLine.textContent = 'ひきわけ！！';
      else winnerLine.textContent = (s1>s2?'P1':'P2') + 'のかち！！';
      playFanfare();
      panelOver.classList.remove('hidden');
    }, 650);
  }
}

function update(dt){
  elapsed += dt;
  playStartGrace = Math.max(0, playStartGrace-dt);
  bpm = 100 + Math.min(60, elapsed*0.9);
  scrollSpeed = 320 * (bpm/100);
  distSinceSpawn += scrollSpeed*dt;
  if(comboInProgress){
    comboAcc += scrollSpeed*dt;
    if(comboAcc >= TRAMPOLINE_TO_BIGSPIKE_GAP){
      spawnObstacle(BIGSPIKE_TYPE);
      distSinceSpawn = 0;
      nextGapKeros = OBSTACLE_GAP_MIN + Math.random()*(OBSTACLE_GAP_MAX-OBSTACLE_GAP_MIN);
      comboInProgress = false;
    }
  }
  beatPhase += dt*(bpm/60);
  if(beatPhase>=1){ beatPhase-=1; onBeat(); }
  beatPulse = Math.max(0, beatPulse-dt*4);

  players.forEach(p=> updatePlayer(p, dt));

  beatDot.style.transform = `translateX(-50%) scale(${1+beatPulse*0.9})`;
  beatDot.style.opacity = 0.5+beatPulse*0.5;
}

// ============================================================
// RENDER
// ============================================================
function drawLaneBackground(p){
  const top = p.bandTop, h = p.bandH;
  ctx.save();
  ctx.beginPath(); ctx.rect(0, top, CW, h); ctx.clip();

  const g = ctx.createLinearGradient(0,top,0,top+h);
  g.addColorStop(0, '#7fe0ff'); g.addColorStop(1,'#d7f7ff');
  ctx.fillStyle = g; ctx.fillRect(0,top,CW,h);

  ctx.fillStyle = '#ffe86b';
  ctx.beginPath(); ctx.arc(CW*0.82, top+h*0.18, 40*p.scale, 0, Math.PI*2); ctx.fill();

  ctx.fillStyle = 'rgba(255,255,255,.9)';
  p.clouds.forEach(c=>{
    ctx.beginPath();
    ctx.ellipse(c.x, c.y, c.r, c.r*0.62, 0,0,Math.PI*2);
    ctx.ellipse(c.x+c.r*0.7, c.y+4, c.r*0.7, c.r*0.5, 0,0,Math.PI*2);
    ctx.ellipse(c.x-c.r*0.6, c.y+6, c.r*0.55, c.r*0.42, 0,0,Math.PI*2);
    ctx.fill();
  });

  ctx.fillStyle = '#bdeea0';
  const gy = groundY(p);
  p.bgFar.forEach(b=>{
    ctx.beginPath();
    ctx.ellipse(b.x, gy+10*p.scale, 80*p.scale, b.h, 0, Math.PI, 0);
    ctx.fill();
  });

  const gg = ctx.createLinearGradient(0,gy,0,top+h);
  gg.addColorStop(0,'#8bd858'); gg.addColorStop(1,'#5fb23a');
  ctx.fillStyle = gg; ctx.fillRect(0, gy, CW, (top+h)-gy);
  ctx.fillStyle = 'rgba(0,0,0,.12)'; ctx.fillRect(0, gy, CW, 5);
  ctx.strokeStyle = 'rgba(0,0,0,.08)'; ctx.lineWidth = 3;
  for(let x=-((elapsed*scrollSpeed)%60); x<CW; x+=60){
    ctx.beginPath(); ctx.moveTo(x, gy+12*p.scale); ctx.lineTo(x+16*p.scale, top+h); ctx.stroke();
  }

  drawStartDecor(p, gy);

  ctx.restore();
}

function drawStartDecor(p, gy){
  const sx = p.startX;
  if(sx < -260 || sx > CW+260) return;
  const s = p.scale;

  // 白いチェッカー柄のスタートライン
  const lineW = 10*s, cell = 8*s;
  ctx.save();
  ctx.beginPath(); ctx.rect(sx-lineW/2, gy, lineW, (p.bandTop+p.bandH)-gy); ctx.clip();
  for(let yy=gy, row=0; yy<p.bandTop+p.bandH+cell; yy+=cell, row++){
    ctx.fillStyle = row%2===0 ? '#ffffff' : '#20232b';
    ctx.fillRect(sx-lineW/2, yy, lineW/2, cell);
    ctx.fillStyle = row%2===0 ? '#20232b' : '#ffffff';
    ctx.fillRect(sx, yy, lineW/2, cell);
  }
  ctx.restore();

  // 「ケロジャンプレース」の旗バナー
  const poleH = 78*s, poleGap = 76*s;
  const px1 = sx-poleGap, px2 = sx+poleGap;
  const poleTopY = gy-poleH;
  ctx.strokeStyle = '#8a5a2c'; ctx.lineWidth = 5*s; ctx.lineCap='round';
  [px1,px2].forEach(px=>{
    ctx.beginPath(); ctx.moveTo(px, gy+2*s); ctx.lineTo(px, poleTopY); ctx.stroke();
  });
  const bannerY = poleTopY, bannerH = 30*s, sway = Math.sin(animTime*1.6)*3*s;
  ctx.fillStyle = '#ff5fa2';
  ctx.beginPath();
  ctx.moveTo(px1, bannerY);
  ctx.lineTo(px2, bannerY);
  ctx.lineTo(px2, bannerY+bannerH);
  ctx.quadraticCurveTo(sx, bannerY+bannerH+8*s+sway, px1, bannerY+bannerH);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#a3195f'; ctx.lineWidth = 2*s; ctx.stroke();
  ctx.fillStyle = '#fff';
  ctx.textAlign = 'center';
  ctx.font = `900 ${15*Math.max(s,0.8)}px 'Mochiy Pop One', sans-serif`;
  ctx.fillText('ケロジャンプレース', sx, bannerY+bannerH*0.68);

  // 応援するケロちゃんギャラリー（6体）
  if(keroImgGreen.complete && keroImgGreen.naturalWidth>0){
    const gW = 20*s, gH = gW*KERO_IMG_ASPECT;
    const offsets = [-190,-155,-122,122,155,190];
    offsets.forEach((off,i)=>{
      const gx = sx+off*s;
      const bounce = Math.abs(Math.sin(animTime*8 + i*1.4))*4*s;
      ctx.drawImage(keroImgGreen, gx-gW/2, gy-gH+3*s-bounce, gW, gH);
    });
  }
}

const FROG_VISUAL_SCALE = 1.5; // ケロちゃんの見た目サイズ倍率（当たり判定も連動）
const KERO_IMG_ASPECT = 305/272;
const keroImgGreen = new Image();
keroImgGreen.src = 'data:image/png;base64,' + (window.__KERO_B64 || '');
const keroImgPink = new Image();
keroImgPink.src = 'data:image/png;base64,' + (window.__KERO_PINK_B64 || '');
function keroImgFor(p){
  return (mode===2 && p.idx===1) ? keroImgPink : keroImgGreen;
}

function drawFrog(p){
  const {x,y} = p.frog;
  const airborne = !p.frog.grounded;
  const stretch = airborne ? Math.min(1.34, 1+Math.max(0,-p.frog.vy)/(2600*p.scale)) : p.frog.squash;
  const sx = 1/Math.sqrt(stretch)*p.scale, sy = stretch*p.scale;
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(sx, sy);

  const shadowScale = Math.max(0.35, 1 - Math.abs(p.frog.vy)/(2400*p.scale));
  ctx.save();
  ctx.globalAlpha = 0.28*shadowScale;
  ctx.fillStyle = '#1a3a12';
  ctx.beginPath(); ctx.ellipse(0, (groundY(p)-y)/sy + 2, 26*shadowScale*FROG_VISUAL_SCALE, 8*shadowScale*FROG_VISUAL_SCALE, 0,0,Math.PI*2); ctx.fill();
  ctx.restore();

  const down = !p.alive && p.downTimer>0;
  if(down){ ctx.save(); ctx.rotate(Math.PI/2); }

  // 足（ベクター描画） — キャラ画像の下に配置
  const isPink = mode===2 && p.idx===1;
  ctx.fillStyle = down ? (isPink?'#c98aa8':'#8fae7a') : (isPink?'#e0559a':'#4fae3a');
  ctx.strokeStyle = isPink?'#8a2d5e':'#245c1c'; ctx.lineWidth = 3;
  const legSpread = (airborne ? 16 : 8) * FROG_VISUAL_SCALE;
  [[-1],[1]].forEach(([dir], legIdx)=>{
    let lx = dir*legSpread, ly = 8*FROG_VISUAL_SCALE, rot = dir*0.5;
    if(!airborne){
      // 2コマのパタパタアニメーション（滑らかな補間はせず、カクッと切り替える）
      const frame = Math.floor(p.frog.legPhase) % 2;
      const kick = ((frame + legIdx) % 2 === 0) ? 1 : -1;
      lx += dir*kick*3*FROG_VISUAL_SCALE;
      ly -= Math.max(0, kick)*4*FROG_VISUAL_SCALE;
      rot += kick*0.3;
    }
    ctx.beginPath(); ctx.ellipse(lx, ly, 11*FROG_VISUAL_SCALE, 7*FROG_VISUAL_SCALE, rot, 0, Math.PI*2); ctx.fill(); ctx.stroke();
  });

  // ケロちゃん本体（写真素材、P2はピンク版）
  const imgW = 54*FROG_VISUAL_SCALE, imgH = imgW*KERO_IMG_ASPECT;
  const keroImg = keroImgFor(p);
  if(keroImg.complete && keroImg.naturalWidth>0){
    ctx.drawImage(keroImg, -imgW/2, 11*FROG_VISUAL_SCALE-imgH, imgW, imgH);
  } else {
    // 画像読込前のフォールバック（一瞬のみ表示され得る）
    ctx.fillStyle = p.colorHex; ctx.beginPath(); ctx.ellipse(0,-8,24*FROG_VISUAL_SCALE,20*FROG_VISUAL_SCALE,0,0,Math.PI*2); ctx.fill();
  }

  if(down){
    // ノックアウト演出：ぐるぐる星
    ctx.rotate(-Math.PI/2); // 星は正立させる
    ctx.fillStyle = '#ffd23f';
    for(let i=0;i<2;i++){
      const ang = elapsed*6 + i*Math.PI;
      const sxp = Math.cos(ang)*16*FROG_VISUAL_SCALE, syp = -imgH*0.55 + Math.sin(ang)*5*FROG_VISUAL_SCALE;
      drawStar(sxp, syp, 5, 4*FROG_VISUAL_SCALE, 2*FROG_VISUAL_SCALE);
    }
    ctx.restore();
  }

  ctx.restore();
}

function drawStar(cx, cy, spikes, outerR, innerR){
  let rot = Math.PI/2*3, x=cx, y=cy;
  const step = Math.PI/spikes;
  ctx.beginPath();
  ctx.moveTo(cx, cy-outerR);
  for(let i=0;i<spikes;i++){
    x = cx + Math.cos(rot)*outerR; y = cy + Math.sin(rot)*outerR;
    ctx.lineTo(x,y); rot += step;
    x = cx + Math.cos(rot)*innerR; y = cy + Math.sin(rot)*innerR;
    ctx.lineTo(x,y); rot += step;
  }
  ctx.lineTo(cx, cy-outerR);
  ctx.closePath(); ctx.fill();
}

function drawObstacle(p, ob){
  const t = ob.type;
  ctx.save();
  if(ob.telegraph>0){
    ctx.globalAlpha = 0.45 + Math.sin(elapsed*30)*0.25;
    ctx.fillStyle = '#fff';
    ctx.font = `900 ${22*p.scale}px sans-serif`; ctx.textAlign='center';
    ctx.fillText('！', ob.x+ob.w/2, ob.y-6*p.scale);
    ctx.globalAlpha = 0.5;
  }
  ctx.translate(ob.x, ob.y);
  ctx.fillStyle = t.color; ctx.strokeStyle = t.dark; ctx.lineWidth = 3*p.scale;

  if(t.id==='spike' || t.id==='bigspike'){
    const n = t.id==='bigspike' ? 6 : 3, sw=ob.w/n;
    ctx.beginPath(); ctx.moveTo(0,ob.h);
    for(let i=0;i<n;i++){ ctx.lineTo(sw*i+sw/2, 2*p.scale); ctx.lineTo(sw*(i+1), ob.h); }
    ctx.closePath(); ctx.fill(); ctx.stroke();
    if(t.id==='bigspike'){
      ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 2*p.scale;
      for(let i=0;i<n;i++){ ctx.beginPath(); ctx.moveTo(sw*i+sw/2, 2*p.scale); ctx.lineTo(sw*i+sw/2, ob.h*0.4); ctx.stroke(); }
    }
  } else if(t.id==='trampoline'){
    const bounce = Math.abs(Math.sin(elapsed*5))*2*p.scale;
    ctx.fillStyle = '#c98f10'; ctx.fillRect(2*p.scale, ob.h*0.6, ob.w-4*p.scale, ob.h*0.4);
    ctx.fillStyle = ob.used ? '#e0a93f' : t.color;
    ctx.strokeStyle = t.dark; ctx.lineWidth = 3*p.scale;
    ctx.beginPath();
    ctx.ellipse(ob.w/2, ob.h*0.55-bounce, ob.w/2-2*p.scale, ob.h*0.42, 0, Math.PI, 0);
    ctx.fill(); ctx.stroke();
    if(!ob.used){
      ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.lineWidth = 2*p.scale;
      for(let i=1;i<4;i++){
        ctx.beginPath();
        ctx.moveTo(ob.w*i/4, ob.h*0.55-bounce);
        ctx.lineTo(ob.w*i/4, ob.h*0.95);
        ctx.stroke();
      }
    }
  }
  ctx.restore();
}

function drawLaneFx(p){
  p.particles.forEach(pt=>{
    ctx.globalAlpha = Math.max(0,pt.life/0.6);
    ctx.fillStyle = pt.color;
    ctx.beginPath(); ctx.arc(pt.x,pt.y,pt.r,0,Math.PI*2); ctx.fill();
  });
  ctx.globalAlpha = 1;
  p.popTexts.forEach(pt=>{
    ctx.save();
    ctx.globalAlpha = Math.max(0, pt.life/pt.maxLife);
    ctx.translate(pt.x,pt.y); ctx.rotate(pt.rot);
    ctx.font = `900 ${26*Math.max(p.scale,0.7)}px 'Mochiy Pop One', sans-serif`;
    ctx.textAlign='center';
    ctx.lineWidth = 5; ctx.strokeStyle='rgba(0,0,0,.35)'; ctx.strokeText(pt.text,0,0);
    ctx.fillStyle = pt.color; ctx.fillText(pt.text,0,0);
    ctx.restore();
  });
  ctx.globalAlpha = 1;
}

function drawLaneHud(p){
  ctx.save();
  ctx.font = `900 ${22*Math.max(p.scale,0.75)}px 'Mochiy Pop One', sans-serif`;
  ctx.textAlign = 'left';
  ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(0,0,0,.35)';
  const label = mode===2 ? `${p.tag} ${Math.floor(p.score)}` : `${Math.floor(p.score)}`;
  ctx.strokeText(label, 14, p.bandTop+30);
  ctx.fillStyle = p.colorHex;
  ctx.fillText(label, 14, p.bandTop+30);
  if(p.combo>1){
    ctx.font = `900 ${13*Math.max(p.scale,0.75)}px 'M PLUS Rounded 1c', sans-serif`;
    ctx.fillStyle = '#ffe86b';
    ctx.strokeText(`COMBO ×${p.combo}`, 14, p.bandTop+48);
    ctx.fillText(`COMBO ×${p.combo}`, 14, p.bandTop+48);
  }
  if(!p.alive){
    if(p.downTimer>0){
      ctx.font = `900 20px 'Mochiy Pop One', sans-serif`;
      ctx.textAlign='center'; ctx.fillStyle='rgba(255,255,255,.85)';
      ctx.fillText('ダウン中…', CW/2, p.bandTop+p.bandH-16);
    } else if(mode===2){
      const cx = CW/2, cy = p.bandTop + p.bandH*0.36;
      ctx.textAlign = 'center';

      ctx.font = `900 ${34*Math.max(p.scale,0.8)}px 'Mochiy Pop One', sans-serif`;
      ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(0,0,0,.35)';
      ctx.strokeText(`${Math.floor(p.score)}`, cx, cy);
      ctx.fillStyle = p.colorHex;
      ctx.fillText(`${Math.floor(p.score)}`, cx, cy);

      ctx.font = `900 ${13*Math.max(p.scale,0.8)}px 'M PLUS Rounded 1c', sans-serif`;
      ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(0,0,0,.35)';
      ctx.strokeText('点数は増えないけど引き続き遊べるケロッ♪', cx, cy+24*Math.max(p.scale,0.8));
      ctx.fillStyle = 'rgba(255,255,255,.9)';
      ctx.fillText('点数は増えないけど引き続き遊べるケロッ♪', cx, cy+24*Math.max(p.scale,0.8));
    }
  }
  ctx.restore();
}

function render(){
  ctx.save();
  if(shake>0){ ctx.translate((Math.random()-0.5)*shake*14, (Math.random()-0.5)*shake*14); }
  ctx.fillStyle = '#000'; ctx.fillRect(0,0,CW,CH);
  players.forEach(p=>{
    drawLaneBackground(p);
    p.obstacles.forEach(ob=> drawObstacle(p,ob));
    drawFrog(p);
    drawLaneFx(p);
    drawLaneHud(p);
  });
  if(mode===2){
    ctx.fillStyle = '#10121a';
    ctx.fillRect(0, players[0].bandTop+players[0].bandH, CW, 6);
  }
  ctx.restore();
}

// ============================================================
// LOOP
// ============================================================
let lastTime = 0, animTime = 0;
function loop(now){
  requestAnimationFrame(loop);
  if(!lastTime) lastTime = now;
  let dt = (now-lastTime)/1000;
  dt = Math.min(dt, 0.033);
  lastTime = now;
  animTime += dt; // カウントダウン中も止まらない、演出専用の時計

  if(faceReady && !useFallback) detectFace(now);
  shake = Math.max(0, shake-dt*3);
  if(state===STATE.PLAY) update(dt);
  if(players.length) render();

  if(panelStart && !panelStart.classList.contains('hidden')){ drawTitleArt(animTime); drawCamPreview(startCamCv); }
  if(!camMini.classList.contains('hidden')) drawCamPreview(camMiniCv);
}
requestAnimationFrame(loop);

async function beginFlow(selectedMode){
  mode = selectedMode;
  ensureAudio();
  errBox.classList.add('hidden');
  [btnStart1P, btnStart2P].forEach(b=> b.disabled = true);
  startCamMsg.textContent = '準備中...';
  if((!faceReady || initializedNumFaces < mode) && !useFallback){ await initFace(mode); }
  [btnStart1P, btnStart2P].forEach(b=> b.disabled = false);
  if(!useFallback){ camMini.classList.remove('hidden'); }
  howtoText.className = 'howto' + (mode===2?' two':'');
  howtoText.innerHTML = mode===2
    ? '横に並んでカメラに顔を映してね。<b>左の人がP1（上のレーン）</b>、<b>右の人がP2（下のレーン）</b>！ 顔を上に動かして相手より長く生き残ろう！'
    : '顔を <b>ピョコッ</b> と上に動かすとジャンプ！ 動きが速いほど高く跳ぶよ。';
  startCountdown();
}
btnStart1P.addEventListener('click', ()=> beginFlow(1));
btnStart2P.addEventListener('click', ()=> beginFlow(2));

btnRetry.addEventListener('click', ()=>{ panelOver.classList.add('hidden'); startCountdown(); });
btnMenu.addEventListener('click', ()=>{ panelOver.classList.add('hidden'); panelStart.classList.remove('hidden'); state = STATE.START; });

function startCountdown(){
  panelStart.classList.add('hidden');
  panelOver.classList.add('hidden');
  resetGame();
  state = STATE.COUNT;
  document.getElementById('panelCount').classList.remove('hidden');
  let n = 3;
  countNum.textContent = n;
  const iv = setInterval(()=>{
    n--;
    if(n>0){ countNum.textContent = n; playHat(); }
    else if(n===0){ countNum.textContent = 'GO!'; playKick(true); }
    else { clearInterval(iv); document.getElementById('panelCount').classList.add('hidden'); state = STATE.PLAY; playStartGrace = 0.4;
      players.forEach(p=>{
        // 顔トラッキングの基準値を「今の実際の顔位置」で初期化し、初期化直後の誤検知ジャンプを防ぐ
        let sample = null;
        if(mode===1) sample = facesRaw[0] || null;
        else if(facesRaw.length>=2) sample = p.idx===0 ? facesRaw[0] : facesRaw[1];
        else if(facesRaw.length===1 && p.idx===0) sample = facesRaw[0];
        if(sample){ p.face.smoothY = sample.y; p.face.lastRawX = sample.x; }
        p.face.history = [];
        p.face.velocity = 0;
      });
    }
  }, 550);
}

// fallback controls
window.addEventListener('keydown', (e)=>{
  if(e.code==='Space'){ e.preventDefault(); ensureAudio(); if(useFallback && players[0]) manualJump(players[0]); }
  if(e.code==='Enter' || e.code==='ArrowUp'){ ensureAudio(); if(useFallback && mode===2 && players[1]) manualJump(players[1]); }
});
stage.addEventListener('pointerdown', (e)=>{
  ensureAudio();
  if(!useFallback) return;
  if(mode===1){ manualJump(players[0]); return; }
  const rect = stage.getBoundingClientRect();
  const relY = (e.clientY - rect.top) / rect.height;
  manualJump(relY < 0.5 ? players[0] : players[1]);
});

// PWA: サービスワーカー登録（対応環境のみ、失敗しても通常プレイに影響しない）
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(err=>console.warn('SW registration failed', err));
