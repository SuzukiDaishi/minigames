<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>ケロジャンプ！ ～顔を縦に揺らして跳べ～</title><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#ff5fa2"><link rel="icon" href="icon-192.png"><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#171329;font-family:system-ui,"M PLUS Rounded 1c",sans-serif;touch-action:none}#app{position:fixed;inset:0;display:grid;place-items:center}#stage{position:relative;width:min(100vw,1100px);height:min(100vh,720px);overflow:hidden;background:#87dcff}canvas{display:block;width:100%;height:100%}#cam{position:fixed;width:2px;height:2px;opacity:.01}.ov{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center;background:rgba(22,15,45,.78);color:#fff}.hidden{display:none!important}h1{font-size:clamp(34px,7vw,64px);margin:0;color:#fff;text-shadow:0 5px #d9327d,0 10px 24px #0008}.sub{font-weight:800;line-height:1.8;max-width:620px}.buttons{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}button{border:0;border-radius:999px;padding:15px 27px;font-size:18px;font-weight:900;color:#fff;background:linear-gradient(#ff70b2,#d92f7e);box-shadow:0 6px #8c1850}button.blue{background:linear-gradient(#70dcff,#259dc9);box-shadow:0 6px #126a8c}button:active{transform:translateY(4px);box-shadow:none}.count{font-size:130px;font-weight:1000}.result{font-size:clamp(24px,5vw,42px);font-weight:1000}.hint{position:absolute;z-index:4;left:50%;bottom:8px;transform:translateX(-50%);background:#0008;color:#fff;padding:6px 12px;border-radius:20px;font-size:12px;font-weight:800;white-space:nowrap}.cammini{position:absolute;right:10px;top:10px;width:130px;height:98px;border:3px solid #fff;border-radius:12px;overflow:hidden;z-index:3;background:#111}.cammini canvas{width:100%;height:100%}.err{color:#ffd2d2;background:#7b183baa;padding:10px 14px;border-radius:12px;max-width:600px}.badge{position:absolute;top:10px;left:10px;z-index:4;color:#fff;font-weight:1000;background:#0007;padding:7px 12px;border-radius:18px}
</style></head><body><div id="app"><div id="stage"><video id="cam" autoplay muted playsinline></video><canvas id="game"></canvas><div class="badge" id="badge">SCORE 0</div><div class="cammini"><canvas id="camCv"></canvas></div><div class="hint">顔を上にピョコッ！／タップ・Space(P1)・Enter(P2)でもジャンプ</div><div class="ov" id="menu"><h1>ケロジャンプ！</h1><div class="sub">～ 顔を縦に揺らして跳べ ～<br>顔を素早く上へ動かすとケロちゃんがジャンプ。速いほど高く跳ぶ！ トゲを避け、トランポリンで大ジャンプしよう。</div><div class="buttons"><button id="one">🐸 ひとりであそぶ</button><button class="blue" id="two">🐸🐸 ふたりで対戦</button></div><div class="err hidden" id="err"></div></div><div class="ov hidden" id="count"><div class="count" id="countN">3</div></div><div class="ov hidden" id="over"><div class="result" id="result"></div><div class="buttons"><button id="retry">もう一回！</button><button class="blue" id="back">モード選択へ</button></div></div></div></div><script type="module">
import{FaceLandmarker,FilesetResolver}from'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';
const model='https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task';
const cvs=document.querySelector('#game'),ctx=cvs.getContext('2d'),stage=document.querySelector('#stage'),video=document.querySelector('#cam'),camCv=document.querySelector('#camCv'),camCtx=camCv.getContext('2d');let W=960,H=540,DPR=1;function resize(){const r=stage.getBoundingClientRect();DPR=Math.min(devicePixelRatio||1,2);cvs.width=r.width*DPR;cvs.height=r.height*DPR;ctx.setTransform(cvs.width/W,0,0,cvs.height/H,0,0);camCv.width=260;camCv.height=196}addEventListener('resize',resize);resize();
const $=s=>document.querySelector(s),menu=$('#menu'),count=$('#count'),over=$('#over'),err=$('#err'),badge=$('#badge');let detector=null,stream=null,inferBusy=false,lastInfer=0,mode=1,state='menu',lastMode=1,worldX=0,speed=280,spawnX=900,score=0,best=+localStorage.keroBest||0,obstacles=[],tramps=[],clouds=[],audio=null,beatT=0;
function frog(i){return{id:i,x:i?310:190,y:420,vy:0,r:27,ground:true,alive:true,score:0,faceY:null,faceYS:null,lastFaceY:null,faceSeen:0,color:i?'#ff78b7':'#55d83c',dark:i?'#d13f87':'#289e27'}}let P=[frog(0),frog(1)];
function resetPlayers(){P=[frog(0),frog(1)]}
function initAudio(){if(audio)return;audio=new(window.AudioContext||window.webkitAudioContext)()}function blip(f=440,d=.06,v=.12){if(!audio)return;let o=audio.createOscillator(),g=audio.createGain(),t=audio.currentTime;o.frequency.value=f;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(audio.destination);o.start();o.stop(t+d)}
async function setup(){if(stream&&detector)return;try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:640},height:{ideal:480}},audio:false});video.srcObject=stream;await video.play();const files=await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm');const make=delegate=>FaceLandmarker.createFromOptions(files,{baseOptions:{modelAssetPath:model,delegate},runningMode:'VIDEO',numFaces:2,outputFaceBlendshapes:false,outputFacialTransformationMatrixes:false});try{detector=await make('GPU')}catch{detector=await make('CPU')}}catch(e){err.textContent='カメラを使えません。タップ／Space／Enterでも遊べます：'+e.message;err.classList.remove('hidden')}}
function jump(i,power=0){const p=P[i];if(!p||!p.alive||!p.ground)return;p.ground=false;p.vy=-(620+Math.min(360,power*8000));blip(i?560:440,.06,.13)}
function faceCenter(lm){let sx=0,sy=0;for(const p of lm){sx+=p.x;sy+=p.y}return{x:sx/lm.length,y:sy/lm.length}}
function infer(now){if(!detector||inferBusy||video.readyState<2||now-lastInfer<34)return;lastInfer=now;inferBusy=true;try{const res=detector.detectForVideo(video,now),arr=(res.faceLandmarks||[]).map(faceCenter).sort((a,b)=>a.x-b.x);for(let i=0;i<Math.min(mode,arr.length);i++){const p=P[i],y=arr[i].y;p.faceSeen=now;p.faceYS=p.faceYS==null?y:p.faceYS*.55+y*.45;if(p.lastFaceY!=null){const up=p.lastFaceY-p.faceYS;if(up>.010)jump(i,up)}p.lastFaceY=p.faceYS}for(let i=0;i<mode;i++)if(now-P[i].faceSeen>700)P[i].lastFaceY=null}catch{}inferBusy=false}
function start(m){lastMode=mode=m;initAudio();setup();menu.classList.add('hidden');over.classList.add('hidden');count.classList.remove('hidden');let n=3;$('#countN').textContent=n;blip(660);const id=setInterval(()=>{n--;if(n>0){$('#countN').textContent=n;blip(660)}else{clearInterval(id);$('#countN').textContent='GO!';blip(880,.15,.2);setTimeout(begin,450)}},650)}
function begin(){count.classList.add('hidden');state='play';resetPlayers();worldX=0;speed=280;spawnX=900;score=0;obstacles=[];tramps=[];clouds=Array.from({length:7},(_,i)=>({x:i*170+Math.random()*80,y:50+Math.random()*160,s:.6+Math.random()}));beatT=0}
function end(){if(state!=='play')return;state='over';best=Math.max(best,score|0);localStorage.keroBest=best;if(mode===1)$('#result').innerHTML=`ドテッ！！<br>スコア ${score|0}<br><small>ベスト ${best}</small>`;else{const a=P[0].score|0,b=P[1].score|0;$('#result').innerHTML=`${a===b?'ひきわけ！':a>b?'P1 WIN!':'P2 WIN!'}<br>P1 ${a}　P2 ${b}`}over.classList.remove('hidden')}
function spawn(){const x=W+80;if(Math.random()<.22){tramps.push({x,w:90,h:16});spawnX=x+700+Math.random()*400}else{const tall=Math.random()<.18;obstacles.push({x,w:tall?55:38,h:tall?145:55});spawnX=x+360+Math.random()*330}}
function hitRectCircle(rx,ry,rw,rh,p){const cx=Math.max(rx,Math.min(p.x,rx+rw)),cy=Math.max(ry,Math.min(p.y,ry+rh));return(p.x-cx)**2+(p.y-cy)**2<p.r**2}
function update(dt,now){if(state!=='play')return;worldX+=speed*dt;speed=Math.min(440,speed+3*dt);score+=dt*10;for(let i=0;i<mode;i++)if(P[i].alive)P[i].score+=dt*10;if(spawnX<W+100)spawn();spawnX-=speed*dt;for(const o of obstacles)o.x-=speed*dt;for(const t of tramps)t.x-=speed*dt;obstacles=obstacles.filter(o=>o.x+o.w>-80);tramps=tramps.filter(t=>t.x+t.w>-80);for(let i=0;i<mode;i++){const p=P[i];if(!p.alive)continue;p.vy+=1550*dt;p.y+=p.vy*dt;if(p.y>=420){p.y=420;p.vy=0;p.ground=true}for(const t of tramps)if(p.vy>0&&hitRectCircle(t.x,435,t.w,t.h,p)){p.y=400;p.vy=-880;p.ground=false;blip(760,.09,.15)}for(const o of obstacles)if(hitRectCircle(o.x,475-o.h,o.w,o.h,p)){p.alive=false;p.vy=-260;blip(120,.25,.2)}}if(mode===1&&!P[0].alive)end();if(mode===2&&!P[0].alive&&!P[1].alive)end();if(now-beatT>500){beatT=now;blip(180,.035,.04)}}
function drawFrog(p){ctx.save();ctx.translate(p.x,p.y);ctx.fillStyle=p.color;ctx.strokeStyle='#183d1a';ctx.lineWidth=3;ctx.beginPath();ctx.ellipse(0,0,30,25,0,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.fillStyle='#fff';for(const x of[-14,14]){ctx.beginPath();ctx.arc(x,-23,12,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.fillStyle='#111';ctx.beginPath();ctx.arc(x+2,-22,5,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff'}ctx.strokeStyle='#d6285e';ctx.lineWidth=4;ctx.beginPath();ctx.arc(0,2,14,.2,Math.PI-.2);ctx.stroke();ctx.restore()}
function draw(){ctx.clearRect(0,0,W,H);let sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#72dcff');sky.addColorStop(1,'#d9fbff');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);ctx.fillStyle='#fff9';for(const c of clouds){let x=(c.x-worldX*.12)%1200;if(x<-120)x+=1200;ctx.beginPath();ctx.ellipse(x,c.y,60*c.s,22*c.s,0,0,Math.PI*2);ctx.fill()}ctx.fillStyle='#75cd42';ctx.fillRect(0,445,W,95);ctx.fillStyle='#4fac2c';ctx.fillRect(0,465,W,75);for(const t of tramps){ctx.fillStyle='#ff5fa2';ctx.fillRect(t.x,435,t.w,t.h);ctx.strokeStyle='#fff';ctx.lineWidth=4;ctx.strokeRect(t.x,435,t.w,t.h)}for(const o of obstacles){ctx.fillStyle='#8b3d57';ctx.beginPath();ctx.moveTo(o.x,475);ctx.lineTo(o.x+o.w/2,475-o.h);ctx.lineTo(o.x+o.w,475);ctx.closePath();ctx.fill();ctx.strokeStyle='#fff8';ctx.stroke()}for(let i=0;i<mode;i++)drawFrog(P[i]);badge.textContent=mode===1?`SCORE ${score|0}`:`P1 ${P[0].score|0}　P2 ${P[1].score|0}`;if(video.readyState>=2){camCtx.save();camCtx.scale(-1,1);camCtx.drawImage(video,-camCv.width,0,camCv.width,camCv.height);camCtx.restore()}}
let last=performance.now();function loop(now){requestAnimationFrame(loop);const dt=Math.min(.04,(now-last)/1000);last=now;if(state==='play')infer(now);update(dt,now);draw()}requestAnimationFrame(loop);
$('#one').onclick=()=>start(1);$('#two').onclick=()=>start(2);$('#retry').onclick=()=>start(lastMode);$('#back').onclick=()=>{state='menu';over.classList.add('hidden');menu.classList.remove('hidden')};stage.addEventListener('pointerdown',e=>{initAudio();if(state!=='play')return;const r=stage.getBoundingClientRect();jump(mode===2&&e.clientX-r.left>r.width/2?1:0,.035)});addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();jump(0,.035)}if(e.code==='Enter')jump(mode===2?1:0,.035)});if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{});setup();
</script></body></html>
