<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>柿ピー玉入れ</title><style>html,body{margin:0;height:100%;background:#0b0620;color:#fff;font-family:system-ui,sans-serif;display:grid;place-items:center}p{opacity:.8}</style></head><body><p>柿ピー玉入れを読み込み中…</p><script>
(async()=>{try{const names=['part-00.b64','part-01.b64','part-02.b64','part-03.b64','part-04.b64','part-05.b64'];const parts=await Promise.all(names.map(n=>fetch('./payload/'+n,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(n+' '+r.status);return r.text()})));const b64=parts.join('').trim();const bin=atob(b64);const bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));const html=await new Response(stream).text();document.open();document.write(html);document.close()}catch(e){document.body.innerHTML='<pre style="white-space:pre-wrap;padding:24px">読み込みに失敗しました\n'+String(e)+'</pre>'}})();
</script></body></html>
