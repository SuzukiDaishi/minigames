<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ゆびシャクトリ レース 🐛</title>
<meta name="theme-color" content="#bfe9ff" />
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="シャクトリ" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --sky1:#bfe9ff; --sky2:#e9fbe0; --sun:#fff2a8;
    --p1:#7cc93b; --p1d:#4f8a1f;
    --p2:#ff8a3d; --p2d:#d2641b;
    --cpu:#4fb0e8; --cpud:#2c7fb8;
    --ink:#43361f; --cream:#fff8e8;
    --soil:#caa06a;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Zen Maru Gothic',sans-serif;
    color:var(--ink);
    min-height:100vh;
    background:
      radial-gradient(circle at 82% 12%, var(--sun) 0 60px, transparent 62px),
      radial-gradient(circle at 82% 12%, rgba(255,242,168,.55) 0 110px, transparent 112px),
      linear-gradient(180deg, var(--sky1) 0%, #d7f4ec 45%, var(--sky2) 100%);
    background-attachment:fixed;
    display:flex; flex-direction:column; align-items:center;
    padding:18px 14px 40px;
  }
  /* drifting clouds */
  body::before{
    content:""; position:fixed; inset:0; z-index:-1; pointer-events:none;
    background:
      radial-gradient(closest-side, #fff 70%, transparent) 12% 22%/120px 42px no-repeat,
      radial-gradient(closest-side, #fff 70%, transparent) 30% 16%/170px 54px no-repeat,
      radial-gradient(closest-side, #fff 70%, transparent) 60% 30%/130px 44px no-repeat;
    opacity:.75;
    animation:drift 40s linear infinite alternate;
  }
  @keyframes drift{from{transform:translateX(-12px)}to{transform:translateX(22px)}}

  header{text-align:center; margin-bottom:14px;}
  h1{
    font-family:'Mochiy Pop One',sans-serif;
    font-size:clamp(28px,6vw,46px);
    margin:0;
    color:#5aa01f;
    text-shadow:3px 3px 0 #fff, 5px 5px 0 rgba(90,160,31,.25);
    letter-spacing:1px;
  }
  .sub{font-size:14px; font-weight:700; color:#6c5a3a; margin-top:4px;}

  .wrap{width:100%; max-width:920px; display:flex; flex-direction:column; gap:16px;}

  .card{
    background:var(--cream);
    border:4px solid #fff;
    border-radius:26px;
    box-shadow:0 12px 0 rgba(120,90,40,.18), 0 16px 30px rgba(80,60,20,.18);
    position:relative;
  }

  /* ---- game stage ---- */
  #stage{padding:8px; position:relative; overflow:hidden;}
  #gameCanvas{display:block; width:100%; border-radius:20px;}

  .hud{display:flex; gap:10px; padding:0 6px 6px; flex-wrap:wrap;}
  .chip{
    flex:1 1 0; min-width:150px;
    display:flex; align-items:center; gap:10px;
    background:#fff; border-radius:18px; padding:8px 12px;
    border:3px solid #f1e6cf;
    box-shadow:0 4px 0 rgba(120,90,40,.12);
  }
  .chip .dot{width:22px;height:22px;border-radius:50%;flex:0 0 auto;border:3px solid rgba(0,0,0,.12);}
  .chip .nm{font-weight:900; font-size:15px;}
  .chip .cnt{margin-left:auto; font-family:'Mochiy Pop One'; font-size:20px;}
  .chip .cnt small{font-size:12px; color:#9b8a66; font-family:'Zen Maru Gothic';}

  /* ---- bottom row ---- */
  .row{display:flex; gap:16px; flex-wrap:wrap;}
  .panel{flex:1 1 280px; padding:14px 16px;}
  .panel h2{font-family:'Mochiy Pop One'; font-size:17px; margin:2px 0 10px; color:#5aa01f;}

  #camCard{flex:0 0 auto;}
  .camBox{position:relative; width:288px; height:216px; max-width:100%;
    border-radius:16px; overflow:hidden; background:#10261f;
    border:3px solid #f1e6cf;}
  #previewCanvas{width:100%; height:100%; display:block;}
  .camBox .tag{position:absolute; left:8px; bottom:8px; font-size:12px; font-weight:700;
    background:rgba(0,0,0,.55); color:#fff; padding:3px 8px; border-radius:10px;}
  #camHint{position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    text-align:center; color:#cfe9dd; font-weight:700; font-size:14px; padding:16px;}

  /* controls */
  .seg{display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap;}
  .seg button{
    flex:1 1 0; min-width:110px; cursor:pointer;
    font-family:'Zen Maru Gothic'; font-weight:900; font-size:14px;
    padding:10px 8px; border-radius:14px; border:3px solid #e7d9b8; background:#fff; color:#7a6a44;
    transition:transform .08s, background .15s;
  }
  .seg button:active{transform:translateY(2px);}
  .seg button.on{background:#ffe9a8; color:#7a5a12; border-color:#f0c84a; box-shadow:0 3px 0 #e0b53a;}

  label.fld{display:block; font-weight:700; font-size:13px; margin:0 0 6px;}
  input[type=range]{width:100%; accent-color:#7cc93b;}
  .hintsm{font-size:12px; color:#9b8a66; margin-top:4px;}

  /* big buttons */
  .btn{
    cursor:pointer; border:none; font-family:'Mochiy Pop One';
    font-size:20px; color:#fff; padding:14px 22px; border-radius:18px;
    background:linear-gradient(180deg,#86d24a,#5aa01f);
    box-shadow:0 6px 0 #45801a, 0 10px 16px rgba(70,120,20,.35);
    transition:transform .08s, box-shadow .08s;
  }
  .btn:active{transform:translateY(4px); box-shadow:0 2px 0 #45801a;}
  .btn.alt{background:linear-gradient(180deg,#ffd166,#f0a93a); box-shadow:0 6px 0 #d2861d, 0 10px 16px rgba(200,120,20,.3);}
  .btn:disabled{filter:grayscale(.6) opacity(.6); cursor:default;}

  /* overlay */
  #overlay{position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    background:rgba(30,40,30,.42); backdrop-filter:blur(2px); border-radius:20px; padding:18px; text-align:center;}
  #overlay.hidden{display:none;}
  .modal{background:var(--cream); border:4px solid #fff; border-radius:24px; padding:22px 24px;
    max-width:420px; width:100%; box-shadow:0 14px 30px rgba(40,30,10,.3);}
  .modal h3{font-family:'Mochiy Pop One'; font-size:24px; margin:0 0 8px; color:#5aa01f;}
  .modal p{font-size:14px; line-height:1.7; margin:6px 0;}
  .countNum{font-family:'Mochiy Pop One'; font-size:120px; color:#fff;
    text-shadow:0 6px 0 rgba(0,0,0,.25); animation:pop .9s ease;}
  @keyframes pop{0%{transform:scale(.3);opacity:0}40%{transform:scale(1.15);opacity:1}100%{transform:scale(1)}}
  .winLine{font-family:'Mochiy Pop One'; font-size:30px; margin:6px 0 12px;}
  .err{color:#c0392b; font-weight:700;}
  .howto{font-size:13px; text-align:left; background:#fff; border-radius:14px; padding:12px 14px; margin:12px 0; border:2px dashed #e7d9b8;}
  .howto b{color:#5aa01f;}
  .foot{font-size:12px; color:#9b8a66; text-align:center; margin-top:6px;}
</style>
</head>
<body>
<header>
  <h1>🐛 ゆびシャクトリ レース</h1>
  <div class="sub">人差し指を「曲げて → 伸ばす」と、シャクトリムシが一歩すすむよ！</div>
</header>

<div class="wrap">
  <!-- GAME -->
  <div class="card" id="stage">
    <canvas id="gameCanvas"></canvas>
    <div class="hud">
      <div class="chip"><span class="dot" id="dot1" style="background:var(--p1)"></span>
        <span class="nm" id="nm1">あなた</span>
        <span class="cnt"><span id="cnt1">0</span><small> / <span id="goal1">20</span></small></span></div>
      <div class="chip"><span class="dot" id="dot2" style="background:var(--cpu)"></span>
        <span class="nm" id="nm2">CPU</span>
        <span class="cnt"><span id="cnt2">0</span><small> / <span id="goal2">20</span></small></span></div>
    </div>

    <!-- overlay (menu / countdown / result / error) -->
    <div id="overlay">
      <div class="modal" id="modal"></div>
    </div>
  </div>

  <!-- BOTTOM ROW -->
  <div class="row">
    <div class="card panel" id="camCard">
      <h2>📷 カメラ</h2>
      <div class="camBox">
        <canvas id="previewCanvas" width="576" height="432"></canvas>
        <div id="camHint">「カメラを開始」を押すと<br>ここに手がうつります</div>
        <div class="tag" id="camTag" style="display:none">手をうつしてね</div>
      </div>
    </div>

    <div class="card panel" id="setCard">
      <h2>⚙️ せってい</h2>
      <label class="fld">あそびかた</label>
      <div class="seg" id="modeSeg">
        <button data-mode="cpu" class="on">🤖 ひとり (CPU対戦)</button>
        <button data-mode="2p">👫 ふたり対戦 (両手)</button>
      </div>

      <div id="diffWrap">
        <label class="fld">CPUのつよさ</label>
        <div class="seg" id="diffSeg">
          <button data-diff="easy">やさしい</button>
          <button data-diff="normal" class="on">ふつう</button>
          <button data-diff="hard">つよい</button>
        </div>
      </div>

      <label class="fld">指の感度（右ほど少しの曲げでOK）：<span id="sensVal">6</span></label>
      <input type="range" id="sens" min="1" max="10" value="6" />
      <div class="hintsm">うまく進まないときは感度を上げてね。</div>
    </div>
  </div>

  <div class="foot">
    ※ カメラを使います。ブラウザで「許可」してください。映像はあなたの端末内だけで処理され、どこにも送信されません。<br>
    うまく動かない場合は Chrome 等の最新ブラウザでお試しください。
  </div>
</div>

<script type="module">
import { HandLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

const MODEL = "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task";
const WASM  = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm";

/* ---------- elements ---------- */
const gc = document.getElementById('gameCanvas');
const gctx = gc.getContext('2d');
const pv = document.getElementById('previewCanvas');
const pctx = pv.getContext('2d');
const overlay = document.getElementById('overlay');
const modal = document.getElementById('modal');
const camHint = document.getElementById('camHint');
const camTag = document.getElementById('camTag');

const video = document.createElement('video');
video.playsInline = true; video.muted = true;

/* ---------- game state ---------- */
const HAND_CONNECTIONS=[[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],[9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];
const cpuRates={easy:0.8, normal:1.3, hard:1.9};

const game={
  state:'init',          // init | ready | countdown | racing | finished
  mode:'cpu',            // cpu | 2p
  difficulty:'normal',
  sensitivity:6,
  stepsToWin:20,
  winner:null,
  countdownVal:3,
  players:{
    1:{steps:0, ema:170, closed:false, scrunch:0, seen:false, isCPU:false, cpuAccum:0, landmarks:null, name:'あなた', color:'--p1', dark:'--p1d'},
    2:{steps:0, ema:170, closed:false, scrunch:0, seen:false, isCPU:true,  cpuAccum:0, landmarks:null, name:'CPU',   color:'--cpu', dark:'--cpud'}
  }
};
let landmarker=null, lastResults=null, lastVideoTime=-1, lastTime=0;
let confetti=[];

/* ---------- math helpers ---------- */
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
function angleDeg(a,b,c){
  const v1x=a.x-b.x, v1y=a.y-b.y, v2x=c.x-b.x, v2y=c.y-b.y;
  const dot=v1x*v2x+v1y*v2y;
  const m=(Math.hypot(v1x,v1y)*Math.hypot(v2x,v2y))||1e-6;
  return Math.acos(clamp(dot/m,-1,1))*180/Math.PI;
}
const indexAngle=lm=>angleDeg(lm[5],lm[6],lm[8]);
const cssv=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();

/* ---------- layout ---------- */
let GW=0,GH=0,gDpr=1, L={};
function resizeGame(){
  const rect=gc.parentElement.getBoundingClientRect();
  const cssW=Math.max(280, rect.width-16);
  const cssH=clamp(cssW*0.42, 250, 360);
  gDpr=window.devicePixelRatio||1;
  gc.width=Math.round(cssW*gDpr); gc.height=Math.round(cssH*gDpr);
  gc.style.height=cssH+'px';
  gctx.setTransform(gDpr,0,0,gDpr,0,0);
  GW=cssW; GH=cssH;
  const pad=18;
  L.startX=pad+72;
  L.finishX=GW-pad-30;
  L.laneH=(GH-pad*2)/2;
  L.lane1Y=pad+L.laneH*0.5;
  L.lane2Y=pad+L.laneH*1.5;
}
window.addEventListener('resize', ()=>{resizeGame();});

/* ---------- detection -> players ---------- */
function applyHand(pid, lm){
  const p=game.players[pid];
  const a=indexAngle(lm);
  p.ema = p.ema*0.5 + a*0.5;
  p.landmarks=lm; p.seen=true;
  // visual scrunch (165 straight -> 0, 95 bent -> 1)
  p.scrunch = clamp((165 - p.ema)/(165-95), 0, 1);
  // step counting with hysteresis
  const close = 90 + game.sensitivity*4;   // need to bend below this
  const open  = close + 22;                // need to straighten above this
  if(game.state==='racing' && !p.isCPU){
    if(!p.closed && p.ema < close){ p.closed=true; }
    else if(p.closed && p.ema > open){ p.closed=false; p.steps++; }
  }
}
function updateHands(){
  game.players[1].seen=false; game.players[2].seen=false;
  if(!lastResults || !lastResults.landmarks) return;
  let usedP1=false;
  for(let i=0;i<lastResults.landmarks.length;i++){
    const lm=lastResults.landmarks[i];
    const label=lastResults.handedness?.[i]?.[0]?.categoryName || 'Right';
    if(game.mode==='2p'){
      applyHand(label==='Left'?2:1, lm);
    }else{
      if(usedP1) continue;          // only first hand controls in 1P mode
      applyHand(1, lm); usedP1=true;
    }
  }
}

/* ---------- race step ---------- */
function stepRace(dt, now){
  for(const pid of [1,2]){
    const p=game.players[pid];
    if(p.isCPU){
      p.cpuAccum += cpuRates[game.difficulty]*dt*(0.85+Math.random()*0.3);
      while(p.cpuAccum>=1){ p.cpuAccum-=1; p.steps++; }
      p.scrunch = 0.5+0.5*Math.sin(now/170);
    }
    if(p.steps>=game.stepsToWin && game.winner===null){
      p.steps=game.stepsToWin;
      game.winner=pid;
      finishRace();
    }
  }
}

/* ---------- drawing the worm ---------- */
function drawWorm(ctx, x, baseY, scrunch, colHex, darkHex, isCPU){
  const len  = lerp(70, 38, scrunch);
  const arch = lerp(3, 26, scrunch);
  const segs = 8, r=10;
  // shadow
  ctx.save();
  ctx.fillStyle='rgba(50,40,15,.16)';
  ctx.beginPath(); ctx.ellipse(x+len*0.5, baseY+9, len*0.55, 6, 0,0,Math.PI*2); ctx.fill();
  ctx.restore();
  // body segments along an arched spine (head at +x)
  for(let i=0;i<=segs;i++){
    const t=i/segs;
    const px=x+t*len;
    const py=baseY - Math.sin(Math.PI*t)*arch;
    const rr=r*(0.72+0.34*Math.sin(Math.PI*t));
    ctx.beginPath(); ctx.arc(px,py,rr+1.5,0,Math.PI*2);
    ctx.fillStyle=darkHex; ctx.fill();
    ctx.beginPath(); ctx.arc(px,py,rr,0,Math.PI*2);
    ctx.fillStyle=colHex; ctx.fill();
    // little belly highlight
    ctx.beginPath(); ctx.arc(px-rr*0.3,py-rr*0.3,rr*0.35,0,Math.PI*2);
    ctx.fillStyle='rgba(255,255,255,.35)'; ctx.fill();
  }
  // head at front
  const hx=x+len, hy=baseY;
  const hr=12.5;
  ctx.beginPath(); ctx.arc(hx,hy,hr+2,0,Math.PI*2); ctx.fillStyle=darkHex; ctx.fill();
  ctx.beginPath(); ctx.arc(hx,hy,hr,0,Math.PI*2); ctx.fillStyle=colHex; ctx.fill();
  // antennae
  ctx.strokeStyle=darkHex; ctx.lineWidth=2.5; ctx.lineCap='round';
  for(const s of [-1,1]){
    ctx.beginPath(); ctx.moveTo(hx+2, hy-hr+2);
    ctx.quadraticCurveTo(hx+6+s*2, hy-hr-9, hx+9+s*3, hy-hr-12); ctx.stroke();
    ctx.beginPath(); ctx.arc(hx+9+s*3, hy-hr-13, 2.4, 0, Math.PI*2);
    ctx.fillStyle=darkHex; ctx.fill();
  }
  // eyes
  for(const s of [-1,1]){
    const ex=hx+4, ey=hy-3+s*4.5;
    ctx.beginPath(); ctx.arc(ex,ey,3.4,0,Math.PI*2); ctx.fillStyle='#fff'; ctx.fill();
    ctx.beginPath(); ctx.arc(ex+1.2,ey,1.8,0,Math.PI*2); ctx.fillStyle='#2a2118'; ctx.fill();
  }
  // smile / CPU visor
  ctx.strokeStyle='#2a2118'; ctx.lineWidth=2;
  if(isCPU){
    ctx.beginPath(); ctx.moveTo(hx+2,hy+5); ctx.lineTo(hx+8,hy+5); ctx.stroke();
  }else{
    ctx.beginPath(); ctx.arc(hx+5,hy+3,3.5,0.1*Math.PI,0.9*Math.PI); ctx.stroke();
  }
}

function drawLane(yc, p, key){
  const x0=18, x1=GW-18, h=L.laneH-10;
  // bed
  gctx.fillStyle='#dff3c4';
  roundRect(x0, yc-h/2, x1-x0, h, 16); gctx.fill();
  // soil track strip
  gctx.fillStyle='rgba(202,160,106,.55)';
  roundRect(L.startX-30, yc+6, L.finishX-L.startX+60, h/2-8, 10); gctx.fill();
  // dashed path
  gctx.strokeStyle='rgba(120,90,40,.35)'; gctx.lineWidth=3; gctx.setLineDash([10,10]);
  gctx.beginPath(); gctx.moveTo(L.startX, yc+ (h/2)*0.4); gctx.lineTo(L.finishX, yc+(h/2)*0.4); gctx.stroke();
  gctx.setLineDash([]);
  // grass tufts
  gctx.fillStyle='#9bd35a';
  for(let gx=x0+18; gx<x1-18; gx+=46){
    grass(gx, yc-h/2+10);
  }
  // start post
  gctx.fillStyle='#9b8a66';
  // finish line (checker)
  drawFinish(L.finishX, yc, h);
  // worm
  const progress = clamp(p.steps/game.stepsToWin, 0, 1);
  const wx = L.startX + progress*(L.finishX-L.startX) - 35;
  drawWorm(gctx, wx, yc+10, p.scrunch, cssv(p.color), cssv(p.dark), p.isCPU);
  // name flag at left
  gctx.font="700 13px 'Zen Maru Gothic'";
  gctx.fillStyle=cssv(p.dark);
  gctx.textBaseline='middle';
  gctx.fillText(key, x0+6, yc-h/2+12);
}
function grass(x,y){
  gctx.beginPath();
  gctx.moveTo(x,y); gctx.quadraticCurveTo(x-3,y-9,x-5,y-12);
  gctx.quadraticCurveTo(x-1,y-9,x,y);
  gctx.quadraticCurveTo(x+1,y-10,x+5,y-13);
  gctx.quadraticCurveTo(x+2,y-8,x+1,y);
  gctx.closePath(); gctx.fill();
}
function drawFinish(x, yc, h){
  const w=14, top=yc-h/2, sq=7, rows=Math.ceil(h/sq);
  for(let r=0;r<rows;r++){
    gctx.fillStyle=(r%2)?'#3a3a3a':'#fff';
    gctx.fillRect(x, top+r*sq, w/2, sq);
    gctx.fillStyle=(r%2)?'#fff':'#3a3a3a';
    gctx.fillRect(x+w/2, top+r*sq, w/2, sq);
  }
  // flag
  gctx.fillStyle='#d23b3b';
  gctx.beginPath(); gctx.moveTo(x+w, top-2); gctx.lineTo(x+w+20, top+4); gctx.lineTo(x+w, top+10); gctx.closePath(); gctx.fill();
  gctx.strokeStyle='#7a5a2a'; gctx.lineWidth=2; gctx.beginPath(); gctx.moveTo(x+w, top-4); gctx.lineTo(x+w, top+18); gctx.stroke();
}
function roundRect(x,y,w,h,r){
  gctx.beginPath();
  gctx.moveTo(x+r,y); gctx.arcTo(x+w,y,x+w,y+h,r); gctx.arcTo(x+w,y+h,x,y+h,r);
  gctx.arcTo(x,y+h,x,y,r); gctx.arcTo(x,y,x+w,y,r); gctx.closePath();
}

function drawGame(now, dt){
  gctx.clearRect(0,0,GW,GH);
  // sky inside canvas
  const sky=gctx.createLinearGradient(0,0,0,GH);
  sky.addColorStop(0,'#cdeeff'); sky.addColorStop(1,'#eafbe1');
  gctx.fillStyle=sky; gctx.fillRect(0,0,GW,GH);
  drawLane(L.lane1Y, game.players[1], '1P');
  drawLane(L.lane2Y, game.players[2], game.mode==='2p'?'2P':'CPU');

  // confetti on finish
  if(game.state==='finished'){
    confetti.forEach(c=>{
      c.x+=c.vx*dt*60; c.y+=c.vy*dt*60; c.vy+=0.08; c.r+=c.vr;
      gctx.save(); gctx.translate(c.x,c.y); gctx.rotate(c.r);
      gctx.fillStyle=c.c; gctx.fillRect(-4,-6,8,12); gctx.restore();
    });
    confetti=confetti.filter(c=>c.y<GH+20);
  }
}

/* ---------- preview ---------- */
function drawPreview(){
  if(video.readyState<2) return;
  const w=pv.width, h=pv.height;
  pctx.save();
  pctx.clearRect(0,0,w,h);
  pctx.translate(w,0); pctx.scale(-1,1);
  pctx.drawImage(video,0,0,w,h);
  pctx.restore();
  let anyHand=false;
  if(lastResults && lastResults.landmarks){
    lastResults.landmarks.forEach((lm,i)=>{
      anyHand=true;
      const pts=lm.map(p=>({x:(1-p.x)*w, y:p.y*h}));
      // skeleton
      pctx.strokeStyle='rgba(255,255,255,.55)'; pctx.lineWidth=2;
      HAND_CONNECTIONS.forEach(([a,b])=>{
        pctx.beginPath(); pctx.moveTo(pts[a].x,pts[a].y); pctx.lineTo(pts[b].x,pts[b].y); pctx.stroke();
      });
      pctx.fillStyle='rgba(255,255,255,.8)';
      pts.forEach(p=>{pctx.beginPath();pctx.arc(p.x,p.y,3,0,Math.PI*2);pctx.fill();});
      // index finger highlight, colored by curl
      const a=indexAngle(lm);
      const bent = a < (90+game.sensitivity*4+11);
      pctx.strokeStyle=bent?'#ff5a5a':'#7CFF6b'; pctx.lineWidth=6; pctx.lineCap='round';
      [[5,6],[6,7],[7,8]].forEach(([s,e])=>{
        pctx.beginPath(); pctx.moveTo(pts[s].x,pts[s].y); pctx.lineTo(pts[e].x,pts[e].y); pctx.stroke();
      });
      pctx.fillStyle=bent?'#ff5a5a':'#7CFF6b';
      pctx.beginPath(); pctx.arc(pts[8].x,pts[8].y,7,0,Math.PI*2); pctx.fill();
    });
  }
  camTag.style.display=anyHand?'none':'block';
}

/* ---------- main loop ---------- */
function loop(){
  const now=performance.now();
  const dt=lastTime?Math.min((now-lastTime)/1000,0.1):0; lastTime=now;
  if(landmarker && video.readyState>=2){
    if(video.currentTime!==lastVideoTime){
      lastVideoTime=video.currentTime;
      try{ lastResults=landmarker.detectForVideo(video, now); }catch(e){}
    }
    updateHands();
  }
  if(game.state==='racing') stepRace(dt, now);
  drawPreview();
  drawGame(now, dt);
  updateHUD();
  requestAnimationFrame(loop);
}

/* ---------- HUD / overlay ---------- */
function updateHUD(){
  document.getElementById('cnt1').textContent=game.players[1].steps;
  document.getElementById('cnt2').textContent=game.players[2].steps;
  document.getElementById('goal1').textContent=game.stepsToWin;
  document.getElementById('goal2').textContent=game.stepsToWin;
  document.getElementById('nm1').textContent=game.players[1].name;
  document.getElementById('nm2').textContent=game.players[2].name;
  document.getElementById('dot2').style.background=cssv(game.players[2].color);
}

function showOverlay(html){ modal.innerHTML=html; overlay.classList.remove('hidden'); bindModal(); }
function hideOverlay(){ overlay.classList.add('hidden'); }

function menuHTML(){
  if(game.state==='init'){
    return `<h3>レースをはじめよう！</h3>
      <div class="howto">
        <p>① <b>カメラを開始</b> を押して手をうつす<br>
        ② 人差し指を <b>「ギュッと曲げて → ピンと伸ばす」</b><br>
        ③ 1回で1歩！ さきにゴールしたシャクトリムシの勝ち 🏁</p>
      </div>
      <p style="font-size:13px;color:#9b8a66">右の「せってい」で人数や感度を変えられます。</p>
      <button class="btn" id="primaryBtn" style="margin-top:8px">🎥 カメラを開始</button>`;
  }
  if(game.state==='ready'){
    const m = game.mode==='2p'
      ? 'ふたりとも片手をカメラにうつしてね（左右で 1P / 2P）'
      : '片手をうつして、CPUと勝負！';
    return `<h3>じゅんびOK！</h3>
      <p>${m}</p>
      <button class="btn" id="primaryBtn" style="margin-top:10px">🏁 レーススタート</button>`;
  }
  return '';
}
function loadingHTML(msg){ return `<h3>よみこみ中…</h3><p>${msg}</p>`; }
function errorHTML(msg){
  return `<h3>あれ？</h3><p class="err">${msg}</p>
    <p style="font-size:13px">カメラの「許可」を確認し、最新のブラウザでお試しください。</p>
    <button class="btn alt" id="retryBtn" style="margin-top:8px">もう一度ためす</button>`;
}
function resultHTML(){
  const wp=game.players[game.winner];
  const won = game.mode==='2p' ? `${game.winner}P のかち！` :
              (game.winner===1?'あなたのかち！🎉':'CPUのかち…💧');
  return `<div class="winLine" style="color:${cssv(wp.dark)}">${won}</div>
    <p>1P: ${game.players[1].steps}歩 ／ ${game.mode==='2p'?'2P':'CPU'}: ${game.players[2].steps}歩</p>
    <div style="display:flex;gap:10px;justify-content:center;margin-top:12px;flex-wrap:wrap">
      <button class="btn" id="againBtn">🔁 もう一度</button>
      <button class="btn alt" id="backBtn">⚙️ せってい</button>
    </div>`;
}

function bindModal(){
  const pb=document.getElementById('primaryBtn');
  if(pb) pb.onclick=()=>{ game.state==='init' ? initSystem() : startCountdown(); };
  const rb=document.getElementById('retryBtn'); if(rb) rb.onclick=initSystem;
  const ag=document.getElementById('againBtn'); if(ag) ag.onclick=startCountdown;
  const bk=document.getElementById('backBtn'); if(bk) bk.onclick=()=>{ game.state='ready'; showOverlay(menuHTML()); };
}

/* ---------- system init (camera + model) ---------- */
async function initSystem(){
  showOverlay(loadingHTML('カメラとAIを準備しています…'));
  try{
    const stream=await navigator.mediaDevices.getUserMedia({video:{width:640,height:480,facingMode:'user'}});
    video.srcObject=stream; await video.play();
    camHint.style.display='none';
  }catch(e){
    showOverlay(errorHTML('カメラを開始できませんでした。'+ (e.message||''))); return;
  }
  try{
    const vision=await FilesetResolver.forVisionTasks(WASM);
    try{
      landmarker=await HandLandmarker.createFromOptions(vision,{baseOptions:{modelAssetPath:MODEL,delegate:'GPU'},runningMode:'VIDEO',numHands:2});
    }catch(_){
      landmarker=await HandLandmarker.createFromOptions(vision,{baseOptions:{modelAssetPath:MODEL,delegate:'CPU'},runningMode:'VIDEO',numHands:2});
    }
  }catch(e){
    showOverlay(errorHTML('AIモデルを読み込めませんでした（ネット接続を確認）。')); return;
  }
  game.state='ready';
  showOverlay(menuHTML());
}

/* ---------- race control ---------- */
function resetPlayers(){
  configurePlayers();
  for(const pid of [1,2]){
    Object.assign(game.players[pid], {steps:0, closed:false, cpuAccum:0, ema:170, scrunch:0});
  }
  game.winner=null; confetti=[];
}
function configurePlayers(){
  if(game.mode==='2p'){
    game.players[2].isCPU=false; game.players[2].name='2P';
    game.players[2].color='--p2'; game.players[2].dark='--p2d';
    game.players[1].name='1P';
  }else{
    game.players[2].isCPU=true; game.players[2].name='CPU';
    game.players[2].color='--cpu'; game.players[2].dark='--cpud';
    game.players[1].name='あなた';
  }
  game.players[1].color='--p1'; game.players[1].dark='--p1d';
}
function startCountdown(){
  resetPlayers();
  game.state='countdown'; game.countdownVal=3;
  const tick=()=>{
    if(game.countdownVal>0){
      showOverlay(`<div class="countNum" key="${game.countdownVal}">${game.countdownVal}</div>`);
      game.countdownVal--; setTimeout(tick,800);
    }else{
      showOverlay(`<div class="countNum" style="color:#ffe46b">GO!</div>`);
      setTimeout(()=>{ game.state='racing'; hideOverlay(); }, 500);
    }
  };
  tick();
}
function finishRace(){
  game.state='finished';
  // confetti burst
  const cols=['#ff5a5a','#ffd166','#7cc93b','#4fb0e8','#ff8a3d','#c77dff'];
  for(let i=0;i<90;i++){
    confetti.push({x:GW*Math.random(), y:-10-Math.random()*GH*0.5,
      vx:(Math.random()-0.5)*3, vy:Math.random()*2+1,
      r:Math.random()*Math.PI, vr:(Math.random()-0.5)*0.3,
      c:cols[i%cols.length]});
  }
  setTimeout(()=>{ showOverlay(resultHTML()); }, 700);
}

/* ---------- settings controls ---------- */
document.getElementById('modeSeg').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  document.querySelectorAll('#modeSeg button').forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); game.mode=b.dataset.mode;
  document.getElementById('diffWrap').style.display = game.mode==='cpu'?'block':'none';
  configurePlayers();
});
document.getElementById('diffSeg').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  document.querySelectorAll('#diffSeg button').forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); game.difficulty=b.dataset.diff;
});
const sens=document.getElementById('sens');
sens.addEventListener('input',()=>{ game.sensitivity=+sens.value; document.getElementById('sensVal').textContent=sens.value; });

/* ---------- boot ---------- */
configurePlayers();
resizeGame();
showOverlay(menuHTML());
requestAnimationFrame(loop);

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('../sw.js');
  });
}
</script>
</body>
