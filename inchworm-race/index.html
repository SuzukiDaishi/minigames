<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>ゆびシャクトリ レース 🐛</title>
<meta name="theme-color" content="#bfe9ff" />
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="シャクトリ" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --sky1:#bfe9ff; --sky2:#e9fbe0; --sun:#fff2a8;
    --p1:#7cc93b; --p1d:#4f8a1f;
    --p2:#ff8a3d; --p2d:#d2641b;
    --cpu:#4fb0e8; --cpud:#2c7fb8;
    --ink:#43361f; --cream:#fff8e8;
    --soil:#caa06a;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Zen Maru Gothic',sans-serif;
    color:var(--ink);
    min-height:100vh;
    background:
      radial-gradient(circle at 82% 12%, var(--sun) 0 60px, transparent 62px),
      radial-gradient(circle at 82% 12%, rgba(255,242,168,.55) 0 110px, transparent 112px),
      linear-gradient(180deg, var(--sky1) 0%, #d7f4ec 45%, var(--sky2) 100%);
    background-attachment:fixed;
    display:flex; flex-direction:column; align-items:center;
    padding:14px 12px 24px;
  }
  /* drifting clouds */
  body::before{
    content:""; position:fixed; inset:0; z-index:-1; pointer-events:none;
    background:
      radial-gradient(closest-side, #fff 70%, transparent) 12% 22%/120px 42px no-repeat,
      radial-gradient(closest-side, #fff 70%, transparent) 30% 16%/170px 54px no-repeat,
      radial-gradient(closest-side, #fff 70%, transparent) 60% 30%/130px 44px no-repeat;
    opacity:.75;
    animation:drift 40s linear infinite alternate;
  }
  @keyframes drift{from{transform:translateX(-12px)}to{transform:translateX(22px)}}

  header{text-align:center; margin-bottom:10px;}
  h1{
    font-family:'Mochiy Pop One',sans-serif;
    font-size:clamp(24px,5vw,40px);
    margin:0;
    color:#5aa01f;
    text-shadow:3px 3px 0 #fff, 5px 5px 0 rgba(90,160,31,.25);
    letter-spacing:1px;
  }
  .sub{font-size:13px; font-weight:700; color:#6c5a3a; margin-top:2px;}

  #rotateHint{
    display:none; margin:0 0 10px; padding:8px 14px;
    background:#fff; border:2px dashed #f0c84a; border-radius:14px;
    font-size:13px; font-weight:700; color:#7a5a12;
  }

  .wrap{width:100%; max-width:1100px; display:flex; flex-direction:column; gap:12px;}

  .card{
    background:var(--cream);
    border:4px solid #fff;
    border-radius:26px;
    box-shadow:0 12px 0 rgba(120,90,40,.18), 0 16px 30px rgba(80,60,20,.18);
    position:relative;
  }

  /* ---- game stage (race front & center) ---- */
  #stage{padding:8px; position:relative; overflow:hidden;}
  #gameCanvas{display:block; width:100%; border-radius:20px;}

  /* HUD floats on top of the race canvas */
  .hud{
    position:absolute; top:16px; left:16px; right:16px;
    display:flex; justify-content:space-between; gap:10px;
    pointer-events:none; z-index:10;
  }
  .chip{
    display:flex; align-items:center; gap:8px;
    background:rgba(255,255,255,.88); border-radius:16px; padding:6px 12px;
    border:3px solid rgba(241,230,207,.9);
    box-shadow:0 4px 0 rgba(120,90,40,.12);
    min-width:0;
  }
  .chip .dot{width:18px;height:18px;border-radius:50%;flex:0 0 auto;border:3px solid rgba(0,0,0,.12);}
  .chip .nm{font-weight:900; font-size:14px; white-space:nowrap;}
  .chip .cnt{font-family:'Mochiy Pop One'; font-size:18px; white-space:nowrap;}
  .chip .cnt small{font-size:11px; color:#9b8a66; font-family:'Zen Maru Gothic';}
  .chip .col{display:flex; flex-direction:column; gap:3px; min-width:0;}
  .spd{width:70px; height:6px; border-radius:3px; background:#efe7d4; overflow:hidden;}
  .spd i{display:block; height:100%; width:0%;
    background:linear-gradient(90deg,#7cc93b,#ffd166,#ff5a5a);
    border-radius:3px; transition:width .15s;}

  /* camera picture-in-picture */
  #pip{
    position:absolute; right:14px; bottom:14px; z-index:20;
    width:clamp(120px, 24%, 230px); aspect-ratio:4/3;
    border-radius:14px; overflow:hidden; background:#10261f;
    border:3px solid #fff; box-shadow:0 6px 14px rgba(40,30,10,.35);
    cursor:pointer; transition:width .2s ease;
  }
  #pip.mini{width:88px;}
  #previewCanvas{width:100%; height:100%; display:block;}
  #pip .tag{position:absolute; left:6px; bottom:6px; font-size:11px; font-weight:700;
    background:rgba(0,0,0,.55); color:#fff; padding:2px 7px; border-radius:8px;}
  #camHint{position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    text-align:center; color:#cfe9dd; font-weight:700; font-size:11px; padding:8px;}

  /* stage corner buttons (above the overlay so sound/fullscreen always work) */
  .stageBtns{position:absolute; left:16px; bottom:16px; z-index:40; display:flex; gap:8px;}
  .iconBtn{
    width:44px; height:44px; border-radius:50%; cursor:pointer;
    border:3px solid #fff; background:rgba(255,248,232,.92);
    font-size:19px; line-height:1; display:flex; align-items:center; justify-content:center;
    box-shadow:0 4px 0 rgba(120,90,40,.18);
    transition:transform .08s;
  }
  .iconBtn:active{transform:translateY(3px);}

  /* settings inside the modal */
  .setBox{background:#fff; border:2px dashed #e7d9b8; border-radius:16px;
    padding:12px 14px; margin:12px 0; text-align:left;}
  .seg{display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap;}
  .seg button{
    flex:1 1 0; min-width:90px; cursor:pointer;
    font-family:'Zen Maru Gothic'; font-weight:900; font-size:13px;
    padding:9px 6px; border-radius:14px; border:3px solid #e7d9b8; background:#fff; color:#7a6a44;
    transition:transform .08s, background .15s;
  }
  .seg button:active{transform:translateY(2px);}
  .seg button.on{background:#ffe9a8; color:#7a5a12; border-color:#f0c84a; box-shadow:0 3px 0 #e0b53a;}
  label.fld{display:block; font-weight:700; font-size:13px; margin:0 0 6px;}
  input[type=range]{width:100%; accent-color:#7cc93b;}
  .hintsm{font-size:12px; color:#9b8a66; margin-top:4px;}

  /* big buttons */
  .btn{
    cursor:pointer; border:none; font-family:'Mochiy Pop One';
    font-size:19px; color:#fff; padding:13px 22px; border-radius:18px;
    background:linear-gradient(180deg,#86d24a,#5aa01f);
    box-shadow:0 6px 0 #45801a, 0 10px 16px rgba(70,120,20,.35);
    transition:transform .08s, box-shadow .08s;
  }
  .btn:active{transform:translateY(4px); box-shadow:0 2px 0 #45801a;}
  .btn.alt{background:linear-gradient(180deg,#ffd166,#f0a93a); box-shadow:0 6px 0 #d2861d, 0 10px 16px rgba(200,120,20,.3);}
  .btn:disabled{filter:grayscale(.6) opacity(.6); cursor:default;}

  /* overlay */
  #overlay{position:absolute; inset:0; z-index:30; display:flex; align-items:center; justify-content:center;
    background:rgba(30,40,30,.42); backdrop-filter:blur(2px); border-radius:20px;
    padding:16px 16px 70px; text-align:center;}  /* bottom space clears the corner buttons */
  #overlay.hidden{display:none;}
  #overlay.count{background:rgba(20,30,20,.14); backdrop-filter:none;}
  .modal{background:var(--cream); border:4px solid #fff; border-radius:24px; padding:20px 22px;
    max-width:440px; width:100%; max-height:100%; overflow-y:auto;
    box-shadow:0 14px 30px rgba(40,30,10,.3);}
  #overlay.count .modal{background:transparent; border:none; box-shadow:none; overflow:visible;}
  .modal h3{font-family:'Mochiy Pop One'; font-size:23px; margin:0 0 8px; color:#5aa01f;}
  .modal p{font-size:14px; line-height:1.7; margin:6px 0;}
  .countNum{font-family:'Mochiy Pop One'; font-size:130px; color:#fff;
    text-shadow:0 8px 0 rgba(0,0,0,.25); animation:pop .8s ease;}
  @keyframes pop{0%{transform:scale(.3);opacity:0}40%{transform:scale(1.18);opacity:1}100%{transform:scale(1)}}
  .winLine{font-family:'Mochiy Pop One'; font-size:30px; margin:6px 0 12px; animation:pop .6s ease;}
  .err{color:#c0392b; font-weight:700;}
  .howto{font-size:13px; text-align:left; background:#fff; border-radius:14px; padding:12px 14px; margin:12px 0; border:2px dashed #e7d9b8;}
  .howto b{color:#5aa01f;}
  .foot{font-size:11px; color:#9b8a66; text-align:center;}

  /* ---- landscape: race screen fills the view ---- */
  @media (orientation:landscape) and (max-height:600px){
    body{padding:8px 10px 10px;}
    header, .foot, #rotateHint{display:none;}
    .wrap{gap:8px;}
  }
  @media (orientation:portrait) and (max-width:640px){
    #rotateHint{display:block;}
    .modal{padding:14px 16px;}
    .modal h3{font-size:19px;}
    .modal p{font-size:13px;}
    .howto{font-size:12px; padding:10px 12px; margin:8px 0;}
    .btn{font-size:17px; padding:11px 18px;}
  }
  /* fullscreen stage */
  #stage:fullscreen{border-radius:0; border:none; display:flex; flex-direction:column; justify-content:center; background:var(--cream);}
</style>
</head>
<body>
<header>
  <h1>🐛 ゆびシャクトリ レース</h1>
  <div class="sub">人差し指を「曲げて → 伸ばす」と、シャクトリムシが一歩すすむよ！</div>
</header>

<div class="wrap">
  <div id="rotateHint">📱 スマホは <b>よこ向き</b> にすると大画面であそべるよ！</div>

  <!-- GAME (front & center) -->
  <div class="card" id="stage">
    <canvas id="gameCanvas"></canvas>

    <div class="hud">
      <div class="chip"><span class="dot" id="dot1" style="background:var(--p1)"></span>
        <span class="col">
          <span class="nm" id="nm1">あなた</span>
          <span class="spd"><i id="spd1"></i></span>
        </span>
        <span class="cnt"><span id="cnt1">0</span><small> / <span id="goal1">20</span></small></span></div>
      <div class="chip"><span class="dot" id="dot2" style="background:var(--cpu)"></span>
        <span class="col">
          <span class="nm" id="nm2">CPU</span>
          <span class="spd"><i id="spd2"></i></span>
        </span>
        <span class="cnt"><span id="cnt2">0</span><small> / <span id="goal2">20</span></small></span></div>
    </div>

    <!-- camera PiP (tap to shrink / grow) -->
    <div id="pip" title="タップで大きさをかえる">
      <canvas id="previewCanvas" width="576" height="432"></canvas>
      <div id="camHint">カメラを開始すると<br>ここに手がうつるよ</div>
      <div class="tag" id="camTag" style="display:none">手をうつしてね</div>
    </div>

    <div class="stageBtns">
      <button class="iconBtn" id="homeBtn" title="ゲーム一覧にもどる">🏠</button>
      <button class="iconBtn" id="sndBtn" title="サウンド">🔊</button>
      <button class="iconBtn" id="setBtn" title="せってい">⚙️</button>
      <button class="iconBtn" id="fsBtn" title="ぜんがめん">⛶</button>
    </div>

    <!-- overlay (menu / countdown / result / error) -->
    <div id="overlay">
      <div class="modal" id="modal"></div>
    </div>
  </div>

  <div class="foot">
    ※ カメラを使います。ブラウザで「許可」してください。映像はあなたの端末内だけで処理され、どこにも送信されません。<br>
    うまく動かない場合は Chrome 等の最新ブラウザでお試しください。
  </div>
</div>

<script type="module">
import { mountHomeButton, requestCamera, cameraKnownGranted, showCameraHelp, cameraHelpLink }
  from '../shared/minigames.js';

const VISION_CDN = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";
const MODEL = "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task";
const WASM  = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm";

/* ---------- elements ---------- */
const stage = document.getElementById('stage');
const gc = document.getElementById('gameCanvas');
const gctx = gc.getContext('2d');
const pv = document.getElementById('previewCanvas');
const pctx = pv.getContext('2d');
const pip = document.getElementById('pip');
const overlay = document.getElementById('overlay');
const modal = document.getElementById('modal');
const camHint = document.getElementById('camHint');
const camTag = document.getElementById('camTag');

const video = document.createElement('video');
video.playsInline = true; video.muted = true;

/* ---------- pop sound engine (WebAudio, no assets) ---------- */
const SFX = (() => {
  let ctx = null, master = null;
  let muted = localStorage.getItem('shakutori-muted') === '1';
  function ensure(){
    if(!ctx){
      const AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return null;
      ctx = new AC();
      master = ctx.createGain(); master.gain.value = 0.55;
      master.connect(ctx.destination);
    }
    if(ctx.state === 'suspended') ctx.resume();
    return ctx;
  }
  function tone({f=440, f2=null, t=0.12, type='sine', v=0.25, when=0}){
    if(muted || !ensure()) return;
    const t0 = ctx.currentTime + when;
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f, t0);
    if(f2) o.frequency.exponentialRampToValueAtTime(Math.max(20,f2), t0 + t);
    g.gain.setValueAtTime(v, t0);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + t);
    o.connect(g); g.connect(master);
    o.start(t0); o.stop(t0 + t + 0.03);
  }
  function noise({t=0.25, v=0.2, when=0, freq=2000, q=0.8}){
    if(muted || !ensure()) return;
    const t0 = ctx.currentTime + when;
    const len = Math.ceil(ctx.sampleRate * t);
    const buf = ctx.createBuffer(1, len, ctx.sampleRate);
    const d = buf.getChannelData(0);
    for(let i=0;i<len;i++) d[i] = Math.random()*2-1;
    const src = ctx.createBufferSource(); src.buffer = buf;
    const bp = ctx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=freq; bp.Q.value=q;
    const g = ctx.createGain();
    g.gain.setValueAtTime(v, t0);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + t);
    src.connect(bp); bp.connect(g); g.connect(master);
    src.start(t0); src.stop(t0 + t);
  }
  return {
    ensure,
    get muted(){ return muted; },
    toggle(){ muted = !muted; localStorage.setItem('shakutori-muted', muted?'1':'0'); return muted; },
    click(){ tone({f:620, f2:920, t:0.07, type:'triangle', v:0.16}); },
    /* one hop — pitch pops up with speed */
    step(sp){
      const m = 1 + sp*0.9;
      tone({f:340*m, f2:660*m, t:0.09, type:'triangle', v:0.24});
      tone({f:170*m, f2:120, t:0.06, type:'sine', v:0.12});
    },
    cpuStep(){ tone({f:230, f2:300, t:0.05, type:'sine', v:0.06}); },
    /* speed tier up — quick rising jingle */
    tier(lv){
      tone({f:520+lv*120, f2:780+lv*160, t:0.08, type:'square', v:0.12});
      tone({f:780+lv*160, f2:1100+lv*200, t:0.11, type:'square', v:0.12, when:0.07});
    },
    count(){ tone({f:660, t:0.13, type:'square', v:0.16}); },
    go(){
      tone({f:660, f2:1320, t:0.28, type:'square', v:0.18});
      tone({f:990, f2:1980, t:0.28, type:'triangle', v:0.14, when:0.03});
    },
    win(){
      [523,659,784,1046,1319].forEach((f,i)=> tone({f, t:0.22, type:'triangle', v:0.2, when:i*0.09}));
      tone({f:1568, t:0.5, type:'triangle', v:0.16, when:0.48});
      noise({t:0.6, v:0.1, freq:3000, q:0.6, when:0.1});
    },
    lose(){ [440,349,262].forEach((f,i)=> tone({f, f2:f*0.92, t:0.26, type:'sine', v:0.18, when:i*0.18})); },
    goal(){ noise({t:0.35, v:0.22, freq:2400, q:0.7}); tone({f:880, f2:1760, t:0.3, type:'triangle', v:0.2}); },
  };
})();
document.addEventListener('pointerdown', ()=>SFX.ensure(), {once:true});

/* ---------- game state ---------- */
const HAND_CONNECTIONS=[[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],[9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];
const cpuRates={easy:0.8, normal:1.3, hard:1.9};
const TIER_MSG=['','はやい！','すごい!!','サイコー!!!'];

const game={
  state:'init',          // init | ready | countdown | racing | finished
  mode:'cpu',            // cpu | 2p
  difficulty:'normal',
  sensitivity:6,
  stepsToWin:20,
  winner:null,
  countdownVal:3,
  players:{
    1:{steps:0, ema:170, closed:false, scrunch:0, seen:false, isCPU:false, cpuAccum:0, landmarks:null, name:'あなた', color:'--p1', dark:'--p1d',
       px:null, hop:0, speed:0, tier:0, stepTimes:[]},
    2:{steps:0, ema:170, closed:false, scrunch:0, seen:false, isCPU:true,  cpuAccum:0, landmarks:null, name:'CPU',   color:'--cpu', dark:'--cpud',
       px:null, hop:0, speed:0, tier:0, stepTimes:[]}
  }
};
let landmarker=null, lastResults=null, lastVideoTime=-1, lastTime=0;
let confetti=[], parts=[], shake=0;

/* ---------- math helpers ---------- */
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
function angleDeg(a,b,c){
  const v1x=a.x-b.x, v1y=a.y-b.y, v2x=c.x-b.x, v2y=c.y-b.y;
  const dot=v1x*v2x+v1y*v2y;
  const m=(Math.hypot(v1x,v1y)*Math.hypot(v2x,v2y))||1e-6;
  return Math.acos(clamp(dot/m,-1,1))*180/Math.PI;
}
const indexAngle=lm=>angleDeg(lm[5],lm[6],lm[8]);
const cssv=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();

/* ---------- layout (landscape aware) ---------- */
let GW=0,GH=0,gDpr=1, L={};
function resizeGame(){
  const cssW=Math.max(280, stage.clientWidth-16);
  const isLandscape = window.innerWidth > window.innerHeight;
  let cssH;
  if(isLandscape){
    // fill as much vertical space as possible — the race takes the whole view
    const avail = window.innerHeight - stage.getBoundingClientRect().top - 26;
    cssH = clamp(avail, 240, 640);
  }else{
    const avail = window.innerHeight - stage.getBoundingClientRect().top - 120;
    cssH = clamp(Math.max(cssW*0.62, avail*0.72), 300, 460);
  }
  gDpr=window.devicePixelRatio||1;
  gc.width=Math.round(cssW*gDpr); gc.height=Math.round(cssH*gDpr);
  gc.style.height=cssH+'px';
  gctx.setTransform(gDpr,0,0,gDpr,0,0);
  GW=cssW; GH=cssH;
  const pad=Math.max(18, GH*0.06);
  L.startX=pad+72;
  L.finishX=GW-pad-30;
  L.laneH=(GH-pad*2)/2;
  L.lane1Y=pad+L.laneH*0.5;
  L.lane2Y=pad+L.laneH*1.5;
}
window.addEventListener('resize', resizeGame);
window.addEventListener('orientationchange', ()=>setTimeout(resizeGame,150));
document.addEventListener('fullscreenchange', ()=>setTimeout(resizeGame,50));

/* ---------- detection -> players ---------- */
function applyHand(pid, lm){
  const p=game.players[pid];
  const a=indexAngle(lm);
  p.ema = p.ema*0.5 + a*0.5;
  p.landmarks=lm; p.seen=true;
  // visual scrunch (165 straight -> 0, 95 bent -> 1)
  p.scrunch = clamp((165 - p.ema)/(165-95), 0, 1);
  // step counting with hysteresis
  const close = 90 + game.sensitivity*4;   // need to bend below this
  const open  = close + 22;                // need to straighten above this
  if(game.state==='racing' && !p.isCPU){
    if(!p.closed && p.ema < close){ p.closed=true; }
    else if(p.closed && p.ema > open){ p.closed=false; p.steps++; onStep(pid); }
  }
}
function updateHands(){
  game.players[1].seen=false; game.players[2].seen=false;
  if(!lastResults || !lastResults.landmarks) return;
  let usedP1=false;
  for(let i=0;i<lastResults.landmarks.length;i++){
    const lm=lastResults.landmarks[i];
    const label=lastResults.handedness?.[i]?.[0]?.categoryName || 'Right';
    if(game.mode==='2p'){
      applyHand(label==='Left'?2:1, lm);
    }else{
      if(usedP1) continue;          // only first hand controls in 1P mode
      applyHand(1, lm); usedP1=true;
    }
  }
}

/* ---------- speed & step effects ---------- */
function calcSpeed(p, now){
  p.stepTimes = p.stepTimes.filter(t=>now-t<1600);
  return clamp((p.stepTimes.length/1.6)/3, 0, 1);
}
function wormPos(p, laneY){
  const progress = clamp(p.steps/game.stepsToWin, 0, 1);
  const target = L.startX + progress*(L.finishX-L.startX) - 35;
  if(p.px===null) p.px=target;
  return {x:p.px, y:laneY+10, target};
}
function onStep(pid){
  const now=performance.now();
  const p=game.players[pid];
  p.hop=1;
  p.stepTimes.push(now);
  const sp=calcSpeed(p, now);
  const laneY = pid===1 ? L.lane1Y : L.lane2Y;
  const {x,y}=wormPos(p, laneY);
  const dark=cssv(p.dark), col=cssv(p.color);
  // dust burst behind the worm
  const n = 3 + Math.round(sp*5);
  for(let i=0;i<n;i++){
    parts.push({type:'dust', x:x+Math.random()*20, y:y+6,
      vx:-(30+Math.random()*60+sp*120), vy:-(10+Math.random()*40), g:60,
      life:0.4+Math.random()*0.3, max:0.7, r:2.5+Math.random()*3.5,
      c:['#caa06a','#e0c290','#b98d55'][i%3]});
  }
  // +1 pop text
  parts.push({type:'text', x:x+50, y:y-34, vx:0, vy:-46, g:0,
    life:0.7, max:0.7, text:'+1', c:dark, size:15});
  // sparks when going fast
  if(sp>0.6){
    for(let i=0;i<5;i++){
      parts.push({type:'spark', x:x+30, y:y-6,
        vx:(Math.random()-0.5)*180, vy:-(30+Math.random()*120), g:220,
        life:0.5, max:0.5, r:2+Math.random()*2, c:col});
    }
  }
  // sound & tier shout-outs
  if(p.isCPU){ SFX.cpuStep(); }
  else{
    SFX.step(sp);
    const tier = sp>0.85?3 : sp>0.6?2 : sp>0.35?1 : 0;
    if(tier>p.tier){
      SFX.tier(tier);
      parts.push({type:'text', x:x+35, y:y-52, vx:0, vy:-34, g:0,
        life:1.0, max:1.0, text:TIER_MSG[tier], c:'#ff5a5a', size:19});
      if(tier>=2) shake=Math.max(shake,3);
    }
    p.tier=tier;
  }
}

/* ---------- race step ---------- */
function stepRace(dt, now){
  for(const pid of [1,2]){
    const p=game.players[pid];
    if(p.isCPU){
      p.cpuAccum += cpuRates[game.difficulty]*dt*(0.85+Math.random()*0.3);
      while(p.cpuAccum>=1){ p.cpuAccum-=1; p.steps++; onStep(pid); }
      p.scrunch = 0.5+0.5*Math.sin(now/170);
    }
    if(p.steps>=game.stepsToWin && game.winner===null){
      p.steps=game.stepsToWin;
      game.winner=pid;
      finishRace();
    }
  }
}

/* ---------- per-frame animation state ---------- */
function updateAnim(dt, now){
  for(const pid of [1,2]){
    const p=game.players[pid];
    const laneY = pid===1 ? L.lane1Y : L.lane2Y;
    const {target}=wormPos(p, laneY);
    // ease toward target so acceleration is visible
    p.px += (target-p.px)*Math.min(1, dt*7);
    // hop decay
    p.hop = Math.max(0, p.hop - dt*4.5);
    // smoothed speed for effects & HUD
    const sp = calcSpeed(p, now);
    p.speed += (sp - p.speed)*Math.min(1, dt*5);
    if(game.state==='racing' && p.speed<0.15) p.tier=0;
    // speed lines while fast
    if(game.state==='racing' && p.speed>0.5 && Math.random()<dt*(10*p.speed)){
      parts.push({type:'line', x:p.px+90+Math.random()*60, y:laneY-8+(Math.random()-0.5)*L.laneH*0.5,
        vx:-(320+320*p.speed), vy:0, g:0, life:0.3, max:0.3, len:26+Math.random()*22, c:'#ffffff'});
    }
  }
  // particles
  for(const c of parts){
    c.life-=dt;
    c.x+=c.vx*dt; c.y+=c.vy*dt;
    if(c.g) c.vy+=c.g*dt;
  }
  parts=parts.filter(c=>c.life>0);
  if(parts.length>400) parts.splice(0, parts.length-400);
}

/* ---------- drawing the worm ---------- */
function drawWorm(ctx, x, baseY, scrunch, colHex, darkHex, isCPU, hop=0, glow=0, noShadow=false){
  const len  = lerp(70, 38, scrunch);
  const arch = lerp(3, 26, scrunch) + hop*10;
  const segs = 8, r=10;
  const lift = hop*5;
  baseY -= lift;
  // shadow
  if(!noShadow){
    ctx.save();
    ctx.fillStyle='rgba(50,40,15,.16)';
    ctx.beginPath(); ctx.ellipse(x+len*0.5, baseY+9+lift, len*0.55, 6, 0,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }
  ctx.save();
  if(glow>0.55){ ctx.shadowColor=colHex; ctx.shadowBlur=22*glow; }
  // body segments along an arched spine (head at +x)
  for(let i=0;i<=segs;i++){
    const t=i/segs;
    const px=x+t*len;
    const py=baseY - Math.sin(Math.PI*t)*arch;
    const rr=r*(0.72+0.34*Math.sin(Math.PI*t));
    ctx.beginPath(); ctx.arc(px,py,rr+1.5,0,Math.PI*2);
    ctx.fillStyle=darkHex; ctx.fill();
    ctx.beginPath(); ctx.arc(px,py,rr,0,Math.PI*2);
    ctx.fillStyle=colHex; ctx.fill();
    // little belly highlight
    ctx.beginPath(); ctx.arc(px-rr*0.3,py-rr*0.3,rr*0.35,0,Math.PI*2);
    ctx.fillStyle='rgba(255,255,255,.35)'; ctx.fill();
  }
  ctx.restore();
  // head at front
  const hx=x+len, hy=baseY;
  const hr=12.5;
  ctx.beginPath(); ctx.arc(hx,hy,hr+2,0,Math.PI*2); ctx.fillStyle=darkHex; ctx.fill();
  ctx.beginPath(); ctx.arc(hx,hy,hr,0,Math.PI*2); ctx.fillStyle=colHex; ctx.fill();
  // antennae
  ctx.strokeStyle=darkHex; ctx.lineWidth=2.5; ctx.lineCap='round';
  for(const s of [-1,1]){
    ctx.beginPath(); ctx.moveTo(hx+2, hy-hr+2);
    ctx.quadraticCurveTo(hx+6+s*2, hy-hr-9, hx+9+s*3, hy-hr-12); ctx.stroke();
    ctx.beginPath(); ctx.arc(hx+9+s*3, hy-hr-13, 2.4, 0, Math.PI*2);
    ctx.fillStyle=darkHex; ctx.fill();
  }
  // eyes
  for(const s of [-1,1]){
    const ex=hx+4, ey=hy-3+s*4.5;
    ctx.beginPath(); ctx.arc(ex,ey,3.4,0,Math.PI*2); ctx.fillStyle='#fff'; ctx.fill();
    ctx.beginPath(); ctx.arc(ex+1.2,ey,1.8,0,Math.PI*2); ctx.fillStyle='#2a2118'; ctx.fill();
  }
  // smile / CPU visor
  ctx.strokeStyle='#2a2118'; ctx.lineWidth=2;
  if(isCPU){
    ctx.beginPath(); ctx.moveTo(hx+2,hy+5); ctx.lineTo(hx+8,hy+5); ctx.stroke();
  }else{
    ctx.beginPath(); ctx.arc(hx+5,hy+3,3.5,0.1*Math.PI,0.9*Math.PI); ctx.stroke();
  }
}

function drawLane(yc, p, key){
  const x0=18, x1=GW-18, h=L.laneH-10;
  // bed
  gctx.fillStyle='#dff3c4';
  roundRect(x0, yc-h/2, x1-x0, h, 16); gctx.fill();
  // soil track strip
  gctx.fillStyle='rgba(202,160,106,.55)';
  roundRect(L.startX-30, yc+6, L.finishX-L.startX+60, h/2-8, 10); gctx.fill();
  // dashed path
  gctx.strokeStyle='rgba(120,90,40,.35)'; gctx.lineWidth=3; gctx.setLineDash([10,10]);
  gctx.beginPath(); gctx.moveTo(L.startX, yc+ (h/2)*0.4); gctx.lineTo(L.finishX, yc+(h/2)*0.4); gctx.stroke();
  gctx.setLineDash([]);
  // grass tufts
  gctx.fillStyle='#9bd35a';
  for(let gx=x0+18; gx<x1-18; gx+=46){
    grass(gx, yc-h/2+10);
  }
  // finish line (checker)
  drawFinish(L.finishX, yc, h);
  // worm (+ speed ghost trail)
  const {x:wx}=wormPos(p, yc);
  const col=cssv(p.color), dark=cssv(p.dark);
  if(p.speed>0.4){
    for(let g=2; g>=1; g--){
      gctx.globalAlpha=0.10*p.speed*(3-g);
      drawWorm(gctx, wx-g*16*p.speed, yc+10, p.scrunch, col, dark, p.isCPU, p.hop, 0, true);
    }
    gctx.globalAlpha=1;
  }
  drawWorm(gctx, wx, yc+10, p.scrunch, col, dark, p.isCPU, p.hop, p.speed);
  // name flag at left
  gctx.font="700 13px 'Zen Maru Gothic'";
  gctx.fillStyle=dark;
  gctx.textBaseline='middle';
  gctx.fillText(key, x0+6, yc-h/2+12);
}
function grass(x,y){
  gctx.beginPath();
  gctx.moveTo(x,y); gctx.quadraticCurveTo(x-3,y-9,x-5,y-12);
  gctx.quadraticCurveTo(x-1,y-9,x,y);
  gctx.quadraticCurveTo(x+1,y-10,x+5,y-13);
  gctx.quadraticCurveTo(x+2,y-8,x+1,y);
  gctx.closePath(); gctx.fill();
}
function drawFinish(x, yc, h){
  const w=14, top=yc-h/2, sq=7, rows=Math.ceil(h/sq);
  for(let r=0;r<rows;r++){
    gctx.fillStyle=(r%2)?'#3a3a3a':'#fff';
    gctx.fillRect(x, top+r*sq, w/2, sq);
    gctx.fillStyle=(r%2)?'#fff':'#3a3a3a';
    gctx.fillRect(x+w/2, top+r*sq, w/2, sq);
  }
  // flag
  gctx.fillStyle='#d23b3b';
  gctx.beginPath(); gctx.moveTo(x+w, top-2); gctx.lineTo(x+w+20, top+4); gctx.lineTo(x+w, top+10); gctx.closePath(); gctx.fill();
  gctx.strokeStyle='#7a5a2a'; gctx.lineWidth=2; gctx.beginPath(); gctx.moveTo(x+w, top-4); gctx.lineTo(x+w, top+18); gctx.stroke();
}
function roundRect(x,y,w,h,r){
  gctx.beginPath();
  gctx.moveTo(x+r,y); gctx.arcTo(x+w,y,x+w,y+h,r); gctx.arcTo(x+w,y+h,x,y+h,r);
  gctx.arcTo(x,y+h,x,y,r); gctx.arcTo(x,y,x+w,y,r); gctx.closePath();
}

function drawParticles(){
  for(const c of parts){
    const a=clamp(c.life/c.max,0,1);
    if(c.type==='dust'){
      gctx.globalAlpha=a*0.6;
      gctx.fillStyle=c.c;
      gctx.beginPath(); gctx.arc(c.x,c.y,c.r*(0.6+a*0.6),0,Math.PI*2); gctx.fill();
    }else if(c.type==='spark'){
      gctx.globalAlpha=a;
      gctx.fillStyle=c.c;
      gctx.save(); gctx.translate(c.x,c.y); gctx.rotate(c.life*8);
      gctx.fillRect(-c.r,-c.r,c.r*2,c.r*2); gctx.restore();
    }else if(c.type==='line'){
      gctx.globalAlpha=a*0.55;
      gctx.strokeStyle=c.c; gctx.lineWidth=2.5; gctx.lineCap='round';
      gctx.beginPath(); gctx.moveTo(c.x,c.y); gctx.lineTo(c.x+c.len,c.y); gctx.stroke();
    }else if(c.type==='text'){
      gctx.globalAlpha=a;
      gctx.font=`900 ${c.size}px 'Mochiy Pop One'`;
      gctx.textAlign='center'; gctx.textBaseline='middle';
      gctx.lineWidth=4; gctx.strokeStyle='#fff';
      gctx.strokeText(c.text, c.x, c.y);
      gctx.fillStyle=c.c;
      gctx.fillText(c.text, c.x, c.y);
      gctx.textAlign='start';
    }
  }
  gctx.globalAlpha=1;
}

function drawGame(now, dt){
  gctx.clearRect(0,0,GW,GH);
  gctx.save();
  if(shake>0.3){
    gctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake);
  }
  shake*=Math.pow(0.001, dt); // fast decay
  // sky inside canvas
  const sky=gctx.createLinearGradient(0,0,0,GH);
  sky.addColorStop(0,'#cdeeff'); sky.addColorStop(1,'#eafbe1');
  gctx.fillStyle=sky; gctx.fillRect(-10,-10,GW+20,GH+20);
  drawLane(L.lane1Y, game.players[1], '1P');
  drawLane(L.lane2Y, game.players[2], game.mode==='2p'?'2P':'CPU');
  drawParticles();

  // confetti on finish
  if(game.state==='finished'){
    confetti.forEach(c=>{
      c.x+=c.vx*dt*60; c.y+=c.vy*dt*60; c.vy+=0.08; c.r+=c.vr;
      gctx.save(); gctx.translate(c.x,c.y); gctx.rotate(c.r);
      gctx.fillStyle=c.c; gctx.fillRect(-4,-6,8,12); gctx.restore();
    });
    confetti=confetti.filter(c=>c.y<GH+20);
  }
  gctx.restore();
}

/* ---------- preview ---------- */
function drawPreview(){
  if(video.readyState<2) return;
  const w=pv.width, h=pv.height;
  pctx.save();
  pctx.clearRect(0,0,w,h);
  pctx.translate(w,0); pctx.scale(-1,1);
  pctx.drawImage(video,0,0,w,h);
  pctx.restore();
  let anyHand=false;
  if(lastResults && lastResults.landmarks){
    lastResults.landmarks.forEach((lm,i)=>{
      anyHand=true;
      const pts=lm.map(p=>({x:(1-p.x)*w, y:p.y*h}));
      // skeleton
      pctx.strokeStyle='rgba(255,255,255,.55)'; pctx.lineWidth=2;
      HAND_CONNECTIONS.forEach(([a,b])=>{
        pctx.beginPath(); pctx.moveTo(pts[a].x,pts[a].y); pctx.lineTo(pts[b].x,pts[b].y); pctx.stroke();
      });
      pctx.fillStyle='rgba(255,255,255,.8)';
      pts.forEach(p=>{pctx.beginPath();pctx.arc(p.x,p.y,3,0,Math.PI*2);pctx.fill();});
      // index finger highlight, colored by curl
      const a=indexAngle(lm);
      const bent = a < (90+game.sensitivity*4+11);
      pctx.strokeStyle=bent?'#ff5a5a':'#7CFF6b'; pctx.lineWidth=6; pctx.lineCap='round';
      [[5,6],[6,7],[7,8]].forEach(([s,e])=>{
        pctx.beginPath(); pctx.moveTo(pts[s].x,pts[s].y); pctx.lineTo(pts[e].x,pts[e].y); pctx.stroke();
      });
      pctx.fillStyle=bent?'#ff5a5a':'#7CFF6b';
      pctx.beginPath(); pctx.arc(pts[8].x,pts[8].y,7,0,Math.PI*2); pctx.fill();
    });
  }
  camTag.style.display=anyHand?'none':'block';
}

/* ---------- main loop ---------- */
function loop(){
  const now=performance.now();
  const dt=lastTime?Math.min((now-lastTime)/1000,0.1):0; lastTime=now;
  if(landmarker && video.readyState>=2){
    if(video.currentTime!==lastVideoTime){
      lastVideoTime=video.currentTime;
      try{ lastResults=landmarker.detectForVideo(video, now); }catch(e){}
    }
    updateHands();
  }
  if(game.state==='racing') stepRace(dt, now);
  updateAnim(dt, now);
  drawPreview();
  drawGame(now, dt);
  updateHUD();
  requestAnimationFrame(loop);
}

function bindModal(){
  const ch=document.getElementById('camHelpBtn');
  if(ch) ch.onclick=()=>{ SFX.click(); showCameraHelp(); };
  const slot=document.getElementById('camHelpSlot');
  if(slot) slot.appendChild(cameraHelpLink());
  const pb=document.getElementById('primaryBtn');
  if(pb) pb.onclick=()=>{ SFX.click(); game.state==='init' ? initSystem() : startCountdown(); };
  const rb=document.getElementById('retryBtn'); if(rb) rb.onclick=()=>{ SFX.click(); initSystem(); };
  const ag=document.getElementById('againBtn'); if(ag) ag.onclick=()=>{ SFX.click(); startCountdown(); };
  const bk=document.getElementById('backBtn'); if(bk) bk.onclick=()=>{ SFX.click(); game.state='ready'; showOverlay(menuHTML()); };
  // settings inside modal
  const modeSeg=document.getElementById('modeSeg');
  if(modeSeg) modeSeg.addEventListener('click',e=>{
    const b=e.target.closest('button'); if(!b) return;
    SFX.click();
    modeSeg.querySelectorAll('button').forEach(x=>x.classList.remove('on'));
    b.classList.add('on'); game.mode=b.dataset.mode;
    const dw=document.getElementById('diffWrap');
    if(dw) dw.style.display = game.mode==='cpu'?'block':'none';
    configurePlayers();
  });
  const diffSeg=document.getElementById('diffSeg');
  if(diffSeg) diffSeg.addEventListener('click',e=>{
    const b=e.target.closest('button'); if(!b) return;
    SFX.click();
    diffSeg.querySelectorAll('button').forEach(x=>x.classList.remove('on'));
    b.classList.add('on'); game.difficulty=b.dataset.diff;
  });
  const sens=document.getElementById('sens');
  if(sens) sens.addEventListener('input',()=>{
    game.sensitivity=+sens.value;
    const sv=document.getElementById('sensVal'); if(sv) sv.textContent=sens.value;
  });
}

/* ---------- system init (camera + model) ---------- */
async function initSystem(){
  showOverlay(loadingHTML('カメラとAIを準備しています…'));
  try{
    const stream=await requestCamera({video:{width:{ideal:640},height:{ideal:480},facingMode:'user'},audio:false});
    if(video.srcObject!==stream) video.srcObject=stream;
    await video.play();
    camHint.style.display='none';
  }catch(e){
    showOverlay(errorHTML(e.denied
      ? 'カメラの使用が許可されていません。'
      : 'カメラを開始できませんでした。'+ (e.message||''))); return;
  }
  try{
    const { HandLandmarker, FilesetResolver } = await import(VISION_CDN);
    const vision=await FilesetResolver.forVisionTasks(WASM);
    try{
      landmarker=await HandLandmarker.createFromOptions(vision,{baseOptions:{modelAssetPath:MODEL,delegate:'GPU'},runningMode:'VIDEO',numHands:2});
    }catch(_){
      landmarker=await HandLandmarker.createFromOptions(vision,{baseOptions:{modelAssetPath:MODEL,delegate:'CPU'},runningMode:'VIDEO',numHands:2});
    }
  }catch(e){
    showOverlay(errorHTML('AIモデルを読み込めませんでした（ネット接続を確認）。')); return;
  }
  game.state='ready';
  showOverlay(menuHTML());
}

/* ---------- race control ---------- */
function resetPlayers(){
  configurePlayers();
  for(const pid of [1,2]){
    Object.assign(game.players[pid], {steps:0, closed:false, cpuAccum:0, ema:170, scrunch:0,
      px:null, hop:0, speed:0, tier:0, stepTimes:[]});
  }
  game.winner=null; confetti=[]; parts=[]; shake=0;
}
function configurePlayers(){
  if(game.mode==='2p'){
    game.players[2].isCPU=false; game.players[2].name='2P';
    game.players[2].color='--p2'; game.players[2].dark='--p2d';
    game.players[1].name='1P';
  }else{
    game.players[2].isCPU=true; game.players[2].name='CPU';
    game.players[2].color='--cpu'; game.players[2].dark='--cpud';
    game.players[1].name='あなた';
  }
  game.players[1].color='--p1'; game.players[1].dark='--p1d';
}
function startCountdown(){
  resetPlayers();
  game.state='countdown'; game.countdownVal=3;
  const tick=()=>{
    if(game.state!=='countdown') return;
    if(game.countdownVal>0){
      SFX.count();
      showOverlay(`<div class="countNum" key="${game.countdownVal}">${game.countdownVal}</div>`, 'count');
      game.countdownVal--; setTimeout(tick,800);
    }else{
      SFX.go();
      showOverlay(`<div class="countNum" style="color:#ffe46b">GO!</div>`, 'count');
      setTimeout(()=>{ if(game.state==='countdown'){ game.state='racing'; hideOverlay(); } }, 500);
    }
  };
  tick();
}
function finishRace(){
  game.state='finished';
  shake=8;
  SFX.goal();
  const wp=game.players[game.winner];
  const laneY = game.winner===1 ? L.lane1Y : L.lane2Y;
  // starburst at the finish flag
  const col=cssv(wp.color);
  for(let i=0;i<26;i++){
    const a=Math.PI*2*i/26;
    parts.push({type:'spark', x:L.finishX, y:laneY,
      vx:Math.cos(a)*(120+Math.random()*160), vy:Math.sin(a)*(120+Math.random()*160)-60, g:200,
      life:0.8, max:0.8, r:2.5+Math.random()*2.5, c:i%2?col:'#ffd166'});
  }
  // confetti burst
  const cols=['#ff5a5a','#ffd166','#7cc93b','#4fb0e8','#ff8a3d','#c77dff'];
  for(let i=0;i<90;i++){
    confetti.push({x:GW*Math.random(), y:-10-Math.random()*GH*0.5,
      vx:(Math.random()-0.5)*3, vy:Math.random()*2+1,
      r:Math.random()*Math.PI, vr:(Math.random()-0.5)*0.3,
      c:cols[i%cols.length]});
  }
  const humanWon = game.mode==='2p' || game.winner===1;
  setTimeout(()=>{ humanWon ? SFX.win() : SFX.lose(); }, 250);
  setTimeout(()=>{ showOverlay(resultHTML()); }, 900);
}

/* ---------- stage buttons ---------- */
const sndBtn=document.getElementById('sndBtn');
function syncSndBtn(){ sndBtn.textContent = SFX.muted ? '🔇' : '🔊'; }
syncSndBtn();
sndBtn.addEventListener('click',()=>{ SFX.toggle(); syncSndBtn(); SFX.click(); });

document.getElementById('setBtn').addEventListener('click',()=>{
  SFX.click();
  if(game.state==='racing' || game.state==='countdown'){
    game.state = landmarker ? 'ready' : 'init';   // abort race back to menu
  }
  if(game.state==='finished'){ game.state='ready'; }
  showOverlay(menuHTML());
});

document.getElementById('fsBtn').addEventListener('click',()=>{
  SFX.click();
  if(document.fullscreenElement){ document.exitFullscreen(); }
  else if(stage.requestFullscreen){ stage.requestFullscreen(); }
});

pip.addEventListener('click',()=>{ SFX.click(); pip.classList.toggle('mini'); });

mountHomeButton({
  mount: document.getElementById('homeBtn'),
  confirmWhile: () => game.state==='racing' || game.state==='countdown'
});

/* debug hook: window.__shakutori.step(1) simulates one hop (no camera needed) */
window.__shakutori = { game, step:(pid=1)=>{ if(game.state==='racing'){ game.players[pid].steps++; onStep(pid); } } };

/* ---------- boot ---------- */
configurePlayers();
resizeGame();
showOverlay(menuHTML());
requestAnimationFrame(loop);

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('../sw.js');
  });
}
</script>
